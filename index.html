<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Старый Гривенсбург v7.6 (Final Clean Release)</title>
    <style>
        /* --- ЦВЕТА --- */
        :root {
            --bg-color: #1a1a1d; --card-bg: #2c2c2e; --accent: #f39c12;
            --text: #ecf0f1; --bonus-green: #2ecc71; --bonus-red: #e74c3c;
            --combat-blue: #3498db; --mana-blue: #2980b9;
        }

        /* --- БАЗА --- */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text);
            padding: 10px; margin: 0; display: flex; justify-content: center;
        }
        .container {
            background-color: var(--card-bg); padding: 20px; border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7); width: 100%; max-width: 400px;
            border-top: 3px solid var(--accent);
        }
        h2 { text-align: center; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; font-size: 1.5em; }

        /* --- УПРАВЛЕНИЕ --- */
        label { display: block; margin-top: 8px; font-weight: bold; color: #bbb; font-size: 0.9em;}
        select, input {
            width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px;
            border: 1px solid #444; background-color: #3a3a3c; color: white;
            font-size: 14px; box-sizing: border-box;
        }
        select:focus, input:focus { outline: none; border-color: var(--accent);}

        .inline-add-btn {
            background: var(--accent); color: #1a1a1d; border: none; width: 30px; height: 30px;
            border-radius: 50%; font-weight: bold; font-size: 20px; line-height: 1; cursor: pointer;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* --- КУКЛА --- */
        .paper-doll-container {
            position: relative; width: 100%; max-width: 300px; height: 500px;
            margin: 15px auto; border: 3px solid #444; border-radius: 10px;
            background-color: #222; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .base-character { width: 100%; height: 100%; object-fit: cover; }
        
        .doll-slot {
            position: absolute; display: flex; justify-content: center; align-items: center; pointer-events: none;
            border: 1px dashed rgba(255,255,255,0.2); background: rgba(0,0,0,0.2);
            z-index: 5;
        }
        .doll-slot img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.8)); }
        
        /* === ГЕОМЕТРИЯ === */
        .slot-head { top: 10px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; z-index: 6;}
        .slot-chest { top: 90px; left: 50%; transform: translateX(-50%); width: 150px; height: 150px; z-index: 4;}
        .slot-mainhand { top: 18%; left: 2%; width: 70px; height: 240px; z-index: 7;}
        .slot-offhand { top: 18%; right: 2%; width: 70px; height: 240px; z-index: 7;}
        .slot-feet { bottom: 2%; left: 50%; transform: translateX(-50%); width: 100px; height: 90px; z-index: 4;}

        .magic-slot-base { top: 2%; width: 50px; height: 50px; border-radius: 50%; z-index: 10; }
        .slot-magic1 { left: 2%; }
        .slot-magic2 { right: 2%; }

        .acc-slot-base { bottom: 22%; width: 60px; height: 60px; z-index: 10; border-radius: 50%; }
        .slot-ring    { left: 35%; transform: translateX(-50%); }
        .slot-amulet  { left: 65%; transform: translateX(-50%); } 
        
        /* --- ВИТАЛЬНЫЕ ПАРАМЕТРЫ --- */
        .vitals-container { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-top: 10px; }
        .vital-box { flex: 1; background: #333; border-radius: 8px; padding: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #555; }
        .vital-box.hp { border-color: var(--bonus-red); } .vital-box.mp { border-color: var(--mana-blue); }
        .vital-label { font-size: 0.8em; font-weight: bold; }
        .hp .vital-label { color: var(--bonus-red); } .mp .vital-label { color: var(--mana-blue); }
        .vital-value { font-size: 1.2em; font-weight: bold; color: white; }
        .rest-btn { background: #444; border: 1px solid var(--accent); color: var(--accent); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2em; cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .rest-btn:hover { background: var(--accent); color: #1a1a1d; box-shadow: 0 0 15px var(--accent); }
        .rest-btn:active { transform: scale(0.9); }

        /* --- СТАТЫ --- */
        .stats-grid { display: flex; gap: 10px; margin-top: 10px; }
        .stat-box { flex: 1; background: #333; padding: 8px; border-radius: 8px; text-align: center; }
        .bonus-pos { color: var(--bonus-green); } .bonus-neg { color: var(--bonus-red); }
        .stat-title { display: block; font-size: 0.8em; color: #aaa; margin-bottom: 2px; }
        .combat-row { display: flex; gap: 10px; margin-top: 5px; }
        .combat-box { flex: 1; background: #222; padding: 5px; border-radius: 8px; text-align: center; border: 1px solid var(--combat-blue); }
        .combat-val { font-weight: bold; color: var(--combat-blue); font-size: 1.1em; }

        /* --- ЗОЛОТО --- */
        .gold-control-container { margin-top: 15px; background: #333; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; border: 1px solid #555; }
        .gold-adjuster { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 200px; margin-top: 5px; }
        .gold-amount { font-size: 28px; font-weight: bold; color: var(--accent); text-shadow: 2px 2px 4px rgba(0,0,0,0.8); flex-grow: 1; text-align: center; font-family: 'Georgia', serif; }
        .gold-btn { width: 40px; height: 40px; font-size: 24px; }
        .gold-btn.minus { background-color: var(--bonus-red); color: white; }

        /* --- RPG СПИСОК --- */
        .rpg-bonus-container { background: #1e1e20; border: 1px solid #444; border-radius: 8px; padding: 10px; margin-top: 10px; min-height: 50px; }
        .rpg-bonus-list { list-style: none; padding: 0; margin: 0; }
        .rpg-bonus-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #333; }
        .rpg-bonus-item:last-child { border-bottom: none; }
        .bonus-name { font-weight: bold; color: var(--accent); font-size: 0.9em; }
        .bonus-stats { font-size: 0.8em; color: #aaa; text-align: right; }
        .stat-hl { color: var(--bonus-green); } .combat-hl { color: var(--combat-blue); }

        /* --- ИНТЕРФЕЙС --- */
        .gear-cat-btn { background: #444; color: var(--accent); border: 1px solid var(--accent); padding: 5px 10px; border-radius: 15px; font-size: 0.8em; cursor: pointer; font-weight: bold; }
        .backpack-list { list-style: none; padding: 0; margin-top: 5px;}
        .backpack-item { background: #3a3a3c; margin-bottom: 5px; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #555; }
        .backpack-name { display: flex; align-items: center; gap: 5px; }
        .potion-icon { width: 24px; height: 24px; vertical-align: middle; border-radius: 4px; }
        
        .cast-btn {
            background: var(--combat-blue); color: white; border: none; border-radius: 8px;
            width: 40px; height: 40px; margin-top: 5px; cursor: pointer; font-size: 1.2em;
            display: flex; justify-content: center; align-items: center;
        }
        .cast-btn:active { transform: scale(0.95); }
        
        #loot-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; display: none; justify-content: center; align-items: center; }
        .modal-content { background: #2c2c2e; padding: 20px; border-radius: 10px; width: 80%; max-width: 350px; border: 2px solid var(--accent); text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏰 Старый Гривенсбург</h2>

    <div style="display: flex; gap: 10px;">
        <input type="text" id="char-name" placeholder="Имя Героя" oninput="saveData()" style="flex:2">
        <select id="class-select" onchange="handleClassChange()" style="flex:1">
            <option value="warrior_m">Воин (М)</option>
            <option value="warrior_f">Воин (Ж)</option>
            <option value="archer">Лучник</option>
            <option value="mage">Маг</option>
            <option value="priest">Жрец</option>
        </select>
    </div>

    <div class="paper-doll-container">
        <img id="base-hero-img" class="base-character" src="">
        
        <div class="doll-slot slot-head"><img id="img-head" src=""></div>
        <div class="doll-slot slot-chest"><img id="img-chest" src=""></div>
        <div class="doll-slot slot-mainhand"><img id="img-mainhand" src=""></div>
        <div class="doll-slot slot-offhand"><img id="img-offhand" src=""></div>
        <div class="doll-slot slot-feet"><img id="img-feet" src=""></div>
        
        <div class="doll-slot acc-slot-base slot-amulet"><img id="img-amulet" src=""></div>
        <div class="doll-slot acc-slot-base slot-ring"><img id="img-ring" src=""></div>
        
        <div class="doll-slot magic-slot-base slot-magic1"><img id="img-magic1" src=""></div>
        <div class="doll-slot magic-slot-base slot-magic2"><img id="img-magic2" src=""></div>
    </div>

    <div class="vitals-container">
        <div class="vital-box hp">
            <span class="vital-label">❤️ HP</span>
            <span class="vital-value"><span id="current-hp">0</span>/<span id="max-hp">0</span></span>
        </div>
        <button class="rest-btn" onclick="restHero()" title="Отдохнуть в таверне">🛌</button>
        <div class="vital-box mp">
            <span class="vital-label">💧 MP</span>
            <span class="vital-value"><span id="current-mp">0</span>/<span id="max-mp">0</span></span>
        </div>
    </div>

    <div class="combat-row">
        <div class="combat-box">
            <div style="font-size:0.8em; color:#aaa;">АТАКА (БОНУС)</div>
            <div id="atk-display" class="combat-val">+0</div>
        </div>
        <div class="combat-box">
            <div style="font-size:0.8em; color:#aaa;">ЗАЩИТА (БОНУС)</div>
            <div id="def-display" class="combat-val">+0</div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-box"><span class="stat-title">Сила</span><div id="str-display" class="stat-value">0</div></div>
        <div class="stat-box"><span class="stat-title">Ловк.</span><div id="agi-display" class="stat-value">0</div></div>
        <div class="stat-box"><span class="stat-title">Инт.</span><div id="int-display" class="stat-value">0</div></div>
    </div>

    <div class="gold-control-container">
        <label style="margin:0; font-size: 1.1em; color: #bbb;">💰 Золото:</label>
        <div class="gold-adjuster">
            <button class="inline-add-btn gold-btn minus" onclick="adjustGold(-1)">−</button>
            <span id="gold-display" class="gold-amount">5</span>
            <button class="inline-add-btn gold-btn plus" onclick="adjustGold(1)">+</button>
        </div>
    </div>

    <div style="margin-top: 20px; border-top: 1px solid #444; padding-top: 15px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <label style="margin:0;">⚔️ Снаряжение:</label>
            <div>
                <button class="gear-cat-btn" onclick="openLootModal('armor')">🛡️</button>
                <button class="gear-cat-btn" onclick="openLootModal('weapon')">⚔️</button>
                <button class="gear-cat-btn" onclick="openLootModal('accessory')">💍</button>
                <button class="gear-cat-btn" onclick="openLootModal('magic')">✨</button>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div><label>🪖 Голова:</label><select id="head-select" onchange="updatePaperDoll()"><option value="">(Пусто)</option></select></div>
            <div><label>👕 Тело:</label><select id="chest-select" onchange="updatePaperDoll()"><option value="">(Пусто)</option></select></div>
            <div><label>👢 Обувь:</label><select id="feet-select" onchange="updatePaperDoll()"><option value="">(Пусто)</option></select></div>
            <div><label>🗡️ Пр. рука:</label><select id="mainhand-select" onchange="updatePaperDoll()"><option value="">(Пусто)</option></select></div>
            <div><label>🛡️ Лв. рука:</label><select id="offhand-select" onchange="updatePaperDoll()"><option value="">(Пусто)</option></select></div>
            <div></div>

            <div><label>🧿 Амулет:</label><select id="amulet-select" onchange="updatePaperDoll()"><option value="">(Пусто)</option></select></div>
            <div><label>💍 Кольцо:</label><select id="ring-select" onchange="updatePaperDoll()"><option value="">(Пусто)</option></select></div>
            
            <div>
                <label>✨ Магия Лев.:</label>
                <div style="display:flex; gap:5px;">
                    <select id="magic1-select" onchange="updatePaperDoll()"><option value="">(Пусто)</option></select>
                    <button class="cast-btn" onclick="castSpell('magic1')">⚡</button>
                </div>
            </div>
            <div>
                <label>✨ Магия Прав.:</label>
                <div style="display:flex; gap:5px;">
                    <select id="magic2-select" onchange="updatePaperDoll()"><option value="">(Пусто)</option></select>
                    <button class="cast-btn" onclick="castSpell('magic2')">⚡</button>
                </div>
            </div>
        </div>
    </div>

    <div style="margin-top: 15px;">
        <label>✨ Активные Эффекты:</label>
        <div class="rpg-bonus-container">
            <ul id="rpg-bonus-list" class="rpg-bonus-list">
                <li style="text-align:center; color:#555; padding:10px;">Нет экипировки</li>
            </ul>
        </div>
    </div>

    <div style="margin-top: 20px; margin-bottom: 30px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <label>📦 Рюкзак:</label>
            <button class="inline-add-btn" onclick="openLootModal('item')">+</button>
        </div>
        <ul id="backpack-list" class="backpack-list"></ul>
    </div>
</div>

<div id="loot-modal">
    <div class="modal-content">
        <h3 id="modal-title" style="color:var(--accent); margin-top:0;">МАГАЗИН</h3>
        <select id="loot-selector" style="margin-bottom:10px;"></select>
        <button onclick="addItemToInventory()" style="background: var(--bonus-green); width: 100%; padding: 10px; border:none; border-radius: 8px; font-weight:bold; cursor:pointer;">Взять</button>
        <button onclick="document.getElementById('loot-modal').style.display='none'" style="background: #c0392b; width: 100%; margin-top: 5px; padding: 10px; border:none; border-radius: 8px; color:white; cursor:pointer;">Закрыть</button>
    </div>
</div>

<script>
    // ================= ДАННЫЕ =================
    const SLOTS = ['head', 'chest', 'mainhand', 'offhand', 'feet', 'amulet', 'ring', 'magic1', 'magic2'];
    const GITHUB_URL = 'https://drdrum666.github.io/grivensburg-project/';

    const classesDB = {
        warrior_m: { str: 5, agi: 3, int: 2, atk: 0, img: GITHUB_URL + 'assets/heroes/warrior_male_base.png' },
        warrior_f: { str: 5, agi: 3, int: 2, atk: 0, img: GITHUB_URL + 'assets/heroes/warrior_female_base.png' },
        archer:  { str: 2, agi: 5, int: 3, atk: 1, img: GITHUB_URL + 'assets/heroes/warrior_male_base.png' },
        mage:    { str: 2, agi: 2, int: 5, atk: 0, img: GITHUB_URL + 'assets/heroes/warrior_male_base.png' },
        priest:  { str: 2, agi: 2, int: 5, atk: 0, img: GITHUB_URL + 'assets/heroes/warrior_male_base.png' }
    };

    const masterItemsDB = {
        // --- ЭКИПИРОВКА ВОИНА ---
        rusty_helmet: { name: "Железный Шлем", type: "gear", slot: "head", classes: ['warrior_m', 'warrior_f'], icon: GITHUB_URL + "assets/gear/warrior/head/rusty_helmet.png", stats: {str:1, agi:0, int:0}, atk:0, def:0, desc: "+1 Сила" },
        rusty_axe:    { name: "Железный Топор",type: "gear", slot: "mainhand", classes: ['warrior_m', 'warrior_f'], icon: GITHUB_URL + "assets/gear/warrior/mainhand/rusty_axe.png", stats: {str:0, agi:0, int:0}, atk:1, def:0, desc: "+1 Атака" },
        chainmail:    { name: "Кольчуга", type: "gear", slot: "chest", classes: ['warrior_m', 'warrior_f', 'priest'], icon: GITHUB_URL + "assets/gear/warrior/chest/chainmail.png", stats: {str:1, agi:0, int:0}, atk:0, def:0, desc: "+1 Сила" },
        iron_boots:   { name: "Железные Сапоги", type: "gear", slot: "feet", classes: ['warrior_m', 'warrior_f'], icon: GITHUB_URL + "assets/gear/warrior/feet/iron_boots.png", stats: {str:1, agi:0, int:0}, atk:0, def:0, desc: "+1 Сила" },
        wooden_shield:{ name: "Деревянный Щит",  type: "gear", slot: "offhand", classes: ['warrior_m', 'warrior_f', 'priest'], icon: GITHUB_URL + "assets/gear/offhand/wooden_shield.png", stats: {str:0, agi:0, int:0}, atk:0, def:1, desc: "+1 Защита" },
        
        // --- АКСЕССУАРЫ (Общие) ---
        copper_amulet:{ name: "Медный Амулет", type: "gear", slot: "amulet", classes: ['all'], icon: GITHUB_URL + "assets/gear/neck/copper_amulet.png", stats: {str:0, agi:0, int:0}, atk:1, def:0, desc: "+1 Атака" },
        copper_ring:  { name: "Медное Кольцо", type: "gear", slot: "ring", classes: ['all'], icon: GITHUB_URL + "assets/gear/rings/copper_ring.png", stats: {str:0, agi:0, int:1}, atk:0, def:0, desc: "+1 Интеллект" },

        // --- МАГИЯ ---
        fireball:     { name: "Огненный Шар", type: "gear", slot: "magic", classes: ['mage', 'priest'], icon: GITHUB_URL + "assets/gear/spells/fireball.png", stats: {str:0, agi:0, int:0}, atk:0, def:0, manaCost: 5, desc: "Урон 10" },
        aggro:        { name: "Агр", type: "gear", slot: "magic", classes: ['warrior_m', 'warrior_f'], icon: GITHUB_URL + "assets/gear/spells/aggro.png", stats: {str:0, agi:0, int:0}, atk:0, def:0, manaCost: 5, desc: "Агр Врагов" },

        // --- РАСХОДНИКИ ---
        potion_heal:  { name: "Малое Зелье Лечения", type: "consumable", effect: "heal", val: 5, icon: GITHUB_URL + "assets/gear/poison/small_health.png" },
        potion_mana:  { name: "Малое Зелье Маны",    type: "consumable", effect: "mana", val: 5, icon: GITHUB_URL + "assets/gear/poison/small_mana.png" },
        crowbar:      { name: "Лом",           type: "quest" },
        rope:         { name: "Веревка",       type: "quest" },
        torch:        { name: "Факел",         type: "quest" }
    };

    let playerInventory = [];    
    let currentBonuses = { str: 0, agi: 0, int: 0, atk: 0, def: 0 };
    let currentHP = 0; let maxHP = 0;
    let currentMP = 0; let maxMP = 0;
    let currentGold = 5;

    // ================= ЛОГИКА =================
    function adjustGold(amount) {
        currentGold += amount; if (currentGold < 0) currentGold = 0;
        document.getElementById('gold-display').innerText = currentGold; saveData();
    }
    
    function updateVitalsDisplay() {
        const hpEl = document.getElementById('current-hp');
        hpEl.innerText = currentHP; document.getElementById('max-hp').innerText = maxHP;
        hpEl.style.color = currentHP < maxHP * 0.3 ? "#e74c3c" : "white";
        
        const mpEl = document.getElementById('current-mp');
        mpEl.innerText = currentMP; document.getElementById('max-mp').innerText = maxMP;
    }

    function castSpell(slotId) {
        const key = document.getElementById(slotId + '-select').value;
        const item = masterItemsDB[key];
        
        if (!item) { alert("Слот пуст! Нечего колдовать."); return; }
        if (!item.manaCost) { alert("Этот предмет не требует маны."); return; }

        if (currentMP >= item.manaCost) {
            currentMP -= item.manaCost;
            updateVitalsDisplay();
            alert(`Вы использовали ${item.name}! (Потрачено ${item.manaCost} маны).`);
            saveData();
        } else {
            alert("Недостаточно маны!");
        }
    }

    function restHero() {
        if(confirm("Переночевать в таверне и восстановить силы?")) {
            currentHP = maxHP; currentMP = maxMP;
            updateVitalsDisplay(); saveData();
        }
    }

    function useItem(index) {
        const itemKey = playerInventory[index]; const item = masterItemsDB[itemKey];
        
        if (item.type === 'consumable') {
            if (item.effect === 'heal') {
                if (currentHP >= maxHP) { alert("Здоровье полное!"); return; }
                currentHP = Math.min(currentHP + item.val, maxHP);
                alert(`Выпили ${item.name}. HP: ${currentHP}/${maxHP}`);
            }
            if (item.effect === 'mana') {
                if (currentMP >= maxMP) { alert("Мана полная!"); return; }
                currentMP = Math.min(currentMP + item.val, maxMP);
                alert(`Выпили ${item.name}. MP: ${currentMP}/${maxMP}`);
            }
            playerInventory.splice(index, 1);
            updateVitalsDisplay(); refreshInventoryUI(); saveData();
        }
    }

    function deleteItem(index) {
        const itemKey = playerInventory[index];
        if (confirm(`Убрать из рюкзака: ${masterItemsDB[itemKey].name}?`)) {
            playerInventory.splice(index, 1); refreshInventoryUI(); saveData();
        }
    }

    function handleClassChange() {  
        const stats = classesDB[document.getElementById('class-select').value];
        playerInventory = [];
        updateBaseStatsAndImage(); 
        currentHP = maxHP; currentMP = maxMP;
        refreshInventoryUI(); saveData();  
    }

    // ================= UI =================
    
    function openLootModal(filterType) {
        const lootSelect = document.getElementById('loot-selector'); lootSelect.innerHTML = '';
        const currentClass = document.getElementById('class-select').value;

        for (const key in masterItemsDB) {
            const item = masterItemsDB[key];
            let show = false;

            if (filterType === 'armor' && ['head', 'chest', 'feet'].includes(item.slot)) show = true;
            if (filterType === 'weapon' && ['mainhand', 'offhand'].includes(item.slot)) show = true;
            if (filterType === 'accessory' && ['amulet', 'ring'].includes(item.slot)) show = true;
            if (filterType === 'magic' && item.slot === 'magic') show = true;
            if (filterType === 'item' && (item.type === 'consumable' || item.type === 'quest')) show = true;

            // СКРЫВАЕМ НЕДОСТУПНОЕ
            if (show && item.type === 'gear') {
                    if (!item.classes || (!item.classes.includes('all') && !item.classes.includes(currentClass))) show = false;
            }

            if (show) {
                const opt = document.createElement('option'); opt.value = key;
                
                let classSuffix = "";
                if (item.slot === 'magic') {
                    if (item.classes && !item.classes.includes('all')) {
                        if (item.classes.includes('warrior_m')) classSuffix += " [Воин]";
                        if (item.classes.includes('mage')) classSuffix += " [Маг]";
                        if (item.classes.includes('priest')) classSuffix += " [Жрец]";
                    }
                }
                opt.innerText = item.name + classSuffix;
                lootSelect.appendChild(opt);
            }
        }
        document.getElementById('loot-modal').style.display = "flex";
    }

    function addItemToInventory() {
        const itemKey = document.getElementById('loot-selector').value;
        if (!itemKey) { document.getElementById('loot-modal').style.display = "none"; return;}
        playerInventory.push(itemKey); document.getElementById('loot-modal').style.display = "none";
        refreshInventoryUI(); saveData();
    }

    function refreshInventoryUI() {
        const savedSelections = {};
        SLOTS.forEach(s => {
            savedSelections[s] = document.getElementById(`${s}-select`).value;
            document.getElementById(`${s}-select`).innerHTML = '<option value="">(Пусто)</option>';
        });
        document.getElementById('backpack-list').innerHTML = "";
        
        playerInventory.forEach((key, index) => {
            const item = masterItemsDB[key];
            if (item.type === 'gear') {
                 if (item.slot === 'magic') {
                    ['magic1', 'magic2'].forEach(mSlot => {
                        const sel = document.getElementById(`${mSlot}-select`);
                        const opt = document.createElement('option'); opt.value = key; opt.innerText = item.name; sel.appendChild(opt);
                    });
                } else {
                    const sel = document.getElementById(`${item.slot}-select`);
                    if (sel) { const opt = document.createElement('option'); opt.value = key; opt.innerText = item.name; sel.appendChild(opt); }
                }
            } else {
                const li = document.createElement('li'); li.className = 'backpack-item';
                
                let iconHTML = "";
                if (item.icon) {
                    iconHTML = `<img src="${item.icon}" class="potion-icon"> `;
                } else if (item.effect === 'heal') {
                    iconHTML = '<img src="https://via.placeholder.com/16/ff0000/000000?text=HP" class="potion-icon"> ';
                } else if (item.effect === 'mana') {
                    iconHTML = '<img src="https://via.placeholder.com/16/0000ff/ffffff?text=MP" class="potion-icon"> ';
                }
                
                let btn = "";
                if (item.type === 'consumable') {
                    btn = `<button style="background:var(--bonus-green); border:none; border-radius:4px; cursor:pointer; padding: 2px 5px; font-size: 0.8em;" onclick="useItem(${index})">Исп.</button>`;
                } else {
                    btn = `<button style="background:var(--bonus-red); color:white; border:none; border-radius:4px; cursor:pointer; padding: 2px 5px; font-size: 0.8em;" onclick="deleteItem(${index})">Удл.</button>`;
                }
                
                li.innerHTML = `<span class="backpack-name">${iconHTML}${item.name}</span> ${btn}`;
                document.getElementById('backpack-list').appendChild(li);
            }
        });
        
        SLOTS.forEach(s => {
            const sel = document.getElementById(`${s}-select`);
            if (![...sel.options].some(o => o.value === savedSelections[s])) sel.value = "";
            else sel.value = savedSelections[s];
        });
        updatePaperDoll();
    }

    function updateBaseStatsAndImage() {
        const selectedClass = document.getElementById('class-select').value;
        const baseStats = classesDB[selectedClass];
        document.getElementById('base-hero-img').src = baseStats.img;
        
        const totalStr = baseStats.str + currentBonuses.str;
        const totalInt = baseStats.int + currentBonuses.int;

        maxHP = 10 + (totalStr * 2);
        maxMP = (totalInt * 2); 
        
        updateVitalsDisplay();
        
        renderStat('str', baseStats.str, currentBonuses.str);
        renderStat('agi', baseStats.agi, currentBonuses.agi);
        renderStat('int', baseStats.int, currentBonuses.int);
        
        // ИЗМЕНЕНО: Теперь берем базовую атаку класса + бонус шмота
        const totalAtkBonus = currentBonuses.atk + (baseStats.atk || 0);
        
        document.getElementById('atk-display').innerText = (totalAtkBonus>=0?"+":"") + totalAtkBonus;
        document.getElementById('def-display').innerText = (currentBonuses.def>=0?"+":"") + currentBonuses.def;
    }
    
    function renderStat(id, base, bonus) {
        const display = document.getElementById(`${id}-display`);
        let txt = bonus > 0 ? ` (+${bonus})` : (bonus < 0 ? ` (${bonus})` : "");
        let cls = bonus > 0 ? "bonus-pos" : (bonus < 0 ? "bonus-neg" : "");
        display.innerHTML = `${base + bonus} <span class="bonus-indicator ${cls}">${txt}</span>`;
    }

    function updatePaperDoll() {
        currentBonuses = { str: 0, agi: 0, int: 0, atk: 0, def: 0 }; 
        const listContainer = document.getElementById('rpg-bonus-list');
        listContainer.innerHTML = "";
        let hasItems = false;

        SLOTS.forEach(slot => {
            const key = document.getElementById(`${slot}-select`).value;
            const slotImg = document.getElementById(`img-${slot}`);
            
            if (key && masterItemsDB[key]) {
                hasItems = true;
                const item = masterItemsDB[key]; 
                slotImg.src = item.icon; slotImg.style.display = "block";
                
                currentBonuses.str += (item.stats.str || 0); 
                currentBonuses.agi += (item.stats.agi || 0); 
                currentBonuses.int += (item.stats.int || 0);
                currentBonuses.atk += (item.atk || 0);
                currentBonuses.def += (item.def || 0);
                
                const li = document.createElement('li');
                li.className = 'rpg-bonus-item';
                let statTextArr = [];
                if(item.stats.str) statTextArr.push(`<span class="stat-hl">+${item.stats.str} Сила</span>`);
                if(item.stats.agi) statTextArr.push(`<span class="stat-hl">+${item.stats.agi} Ловк.</span>`);
                if(item.stats.int) statTextArr.push(`<span class="stat-hl">+${item.stats.int} Инт.</span>`);
                if(item.atk) statTextArr.push(`<span class="combat-hl">+${item.atk} Атк.</span>`);
                if(item.def) statTextArr.push(`<span class="combat-hl">+${item.def} Защ.</span>`);
                let statsHTML = statTextArr.length > 0 ? statTextArr.join(", ") : "---";
                li.innerHTML = `<span class="bonus-name">${item.name}</span><span class="bonus-stats">${statsHTML}</span>`;
                listContainer.appendChild(li);

            } else { slotImg.style.display = "none"; }
        });

        if(!hasItems) listContainer.innerHTML = '<li style="text-align:center; color:#555; padding:10px;">Нет экипировки</li>';

        updateBaseStatsAndImage(); saveData();
    }

    // ================= SAVE/LOAD (v76) =================
    function saveData() {
        localStorage.setItem('v76_name', document.getElementById('char-name').value);
        localStorage.setItem('v76_class', document.getElementById('class-select').value);
        localStorage.setItem('v76_gold', currentGold);
        localStorage.setItem('v76_inv', JSON.stringify(playerInventory));
        localStorage.setItem('v76_curHP', currentHP);
        localStorage.setItem('v76_curMP', currentMP);
        SLOTS.forEach(s => localStorage.setItem(`v76_${s}`, document.getElementById(`${s}-select`).value));
    }

    function loadData() {
        if(localStorage.getItem('v76_name')) {
            document.getElementById('char-name').value = localStorage.getItem('v76_name');
            document.getElementById('class-select').value = localStorage.getItem('v76_class');
            currentGold = parseInt(localStorage.getItem('v76_gold')) || 5; document.getElementById('gold-display').innerText = currentGold;
            playerInventory = JSON.parse(localStorage.getItem('v76_inv')) || [];
            refreshInventoryUI();
            SLOTS.forEach(s => {
                const val = localStorage.getItem(`v76_${s}`);
                if (val && playerInventory.includes(val)) document.getElementById(`${s}-select`).value = val;
            });
            const savedHP = localStorage.getItem('v76_curHP');
            const savedMP = localStorage.getItem('v76_curMP');
            updateBaseStatsAndImage(); 
            currentHP = savedHP !== null ? parseInt(savedHP) : maxHP;
            currentMP = savedMP !== null ? parseInt(savedMP) : maxMP;
            updateVitalsDisplay();
        } else { handleClassChange(); document.getElementById('gold-display').innerText = currentGold; }
        updatePaperDoll();
    }

    loadData();
</script>
