<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Client v4.1 (VIDEO & MANA)</title>
    <style>
        :root { --bg-dark: #1a1a1d; --bg-panel: #2c2c2e; --accent: #f39c12; --bright-gold: #ffd700; --danger: #c0392b; --mana: #2980b9; --text: #ecf0f1; --bonus-green: #2ecc71; --xp-purple: #9b59b6; }
        html, body { margin:0; padding:0; width: 100vw; height: 100vh; font-family:'Segoe UI',Tahoma,sans-serif; background-color:var(--bg-dark); color:var(--text); overflow: hidden; }

        /* ВХОД (ФОН-ЗАГЛУШКА) */
        #login-screen { 
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:5000; 
            display:flex; flex-direction:column; justify-content:center; align-items:center; gap: 10px; 
            background: url('https://raw.githubusercontent.com/drdrum666/grivensburg-project/main/assets/backs/dashbord_top_16_9.png') no-repeat center center;
            background-size: cover;
        }
        #login-screen::before { content:''; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:-1; }

        .login-title { color: var(--accent); font-size: 3rem; margin-bottom: 20px; text-transform: uppercase; font-family: 'Georgia', serif; text-shadow: 0 0 20px black; }
        .login-input { padding: 15px; font-size: 1.5rem; text-align: center; background: #222; border: 2px solid var(--accent); color: white; border-radius: 10px; width: 300px; }
        .btn-connect { padding: 15px 40px; font-size: 1.5rem; background: var(--accent); border: none; font-weight: bold; cursor: pointer; border-radius: 10px; color: black; margin-top: 10px; transition: 0.2s; }
        .btn-connect:hover { background: #fff; box-shadow: 0 0 20px var(--accent); }

        /* СЦЕНА */
        #main-stage {
            width: 100%; height: 100%;
            /* Картинка по умолчанию */
            background-image: url('https://raw.githubusercontent.com/drdrum666/grivensburg-project/main/assets/backs/dashbord_top_16_9.png');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            position: relative; transition: background-image 0.5s; display: flex; flex-direction: column; justify-content: space-between;
        }
        
        /* ВИДЕО ФОН (СКРЫТ ПО УМОЛЧАНИЮ) */
        #bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; /* Видео растягивается на весь экран */
            z-index: 0;
            display: none; /* JS включит его */
        }

        /* ЗАТЕМНЕНИЕ */
        #main-stage::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); pointer-events: none; z-index: 1; }

        /* ИНТЕРФЕЙС */
        .stream-header { height: 70px; background: #111; border-bottom: 4px solid var(--accent); display: flex; align-items: center; padding: 0 30px; z-index: 50; box-shadow: 0 5px 20px rgba(0,0,0,0.8); flex-shrink: 0; position: relative; }
        .header-title-container { width: 100%; display: flex; justify-content: center; }
        .header-title { color: var(--accent); font-family: 'Georgia', serif; text-transform: uppercase; letter-spacing: 3px; font-size: 2rem; margin: 0; text-shadow: 0 2px 10px rgba(243, 156, 18, 0.4); display: flex; align-items: baseline; gap: 15px; }
        .scenario-tag { font-size: 1.4rem; color: #ccc; font-weight: normal; letter-spacing: 1px; font-family: 'Segoe UI', sans-serif; text-transform: none; }

        /* РАУНД */
        .round-display { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); background: #111; border: 3px solid var(--bright-gold); border-radius: 30px; padding: 5px 40px; color: white; font-weight: 900; font-size: 1.8rem; display: none; gap: 15px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); z-index: 40; align-items: center; }
        .round-display.visible { display: flex; }

        /* ГЕРОИ И ВРАГИ */
        #game-area { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 40px; position: relative; z-index: 10; }
        #party-layer { display: none; justify-content: flex-start; gap: 25px; padding-top: 60px; overflow-x: visible; }
        #party-layer.visible { display: flex; animation: slideDown 0.5s; }
        .player-wrapper { margin-right: 5px; position: relative; display: flex; flex-direction: column; align-items: center; }
        
        .card { width: 270px; height: 380px; background:var(--bg-panel); border: 3px solid var(--bright-gold); border-radius: 10px; position:relative; overflow:hidden; display:flex; flex-direction:column; box-shadow: 0 10px 30px rgba(0,0,0,0.9); transform: scale(1.0); transition: transform 0.1s, border-color 0.1s; }
        .card.dead { filter: grayscale(100%); opacity: 0.6; border-color: #555; }
        .card-bg-full { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .card-overlay-bottom { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.95) 70%, transparent 100%); padding: 10px; box-sizing: border-box; z-index: 5; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid rgba(255,255,255,0.1); }
        .xp-bar-stream { width: 100%; height: 6px; background: #222; position: absolute; top: -6px; left: 0; }
        .xp-fill-stream { height: 100%; background: var(--xp-purple); width: 0%; transition: width 0.5s; box-shadow: 0 0 10px var(--xp-purple); }
        .h-name { font-size:1.6rem; font-weight:bold; color:var(--accent); margin:0; text-shadow:0 2px 4px black; line-height: 1; }
        .h-sub { font-size:0.9rem; color:#ccc; font-style:italic; text-shadow:0 1px 2px black; margin-bottom: 5px; }
        .vitals-row { display:flex; gap:5px; margin-bottom: 5px; }
        .control-group { flex:1; display:flex; align-items:center; background:rgba(20,20,20,0.8); padding:2px; border-radius:4px; border:1px solid #444; height:30px; justify-content: center; }
        .val-display { font-weight:bold; font-size:1rem; }
        .gold-text { color:#f1c40f; } .hp-text { color:var(--danger); } .mp-text { color:var(--mana); }
        .db-stats-container { display: flex; gap: 5px; flex: 1; }
        .db-stat-col { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .db-stat-box { background: #1a1a1d; border: 1px solid #444; padding: 5px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; color: #ccc; }
        .player-name-tag { color: var(--accent); font-weight: bold; font-size: 1.4rem; font-family: 'Georgia', serif; text-shadow: 0 2px 5px black; border-top: 2px solid var(--accent); padding: 5px 10px; width: 100%; text-align: center; background: rgba(0,0,0,0.8); border-radius: 0 0 10px 10px; position: relative; z-index: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }

        /* ОЧЕРЕДЬ */
        #queue-layer { display: flex; justify-content: flex-start; opacity: 0; transition: opacity 0.5s; align-items: center; height: 100px; }
        #queue-layer.visible { opacity: 1; }
        .queue-strip { display: flex; gap: 7px; padding: 0; background: transparent; transform: scale(1.3); transform-origin: center left; }
        .queue-card { width: 80px; height: 110px; border-radius: 6px; overflow: hidden; border: 2px solid #555; position: relative; background: #111; box-shadow: 0 5px 15px rgba(0,0,0,0.6); }
        .queue-card.player { border-color: var(--bonus-green); } .queue-card.enemy { border-color: var(--danger); }
        .queue-card:first-child { border-color: var(--bright-gold); box-shadow: 0 0 20px rgba(255, 215, 0, 0.8); transform: scale(1.15); margin-right: 10px; z-index: 20; }
        .queue-card img { width: 100%; height: 100%; object-fit: cover; }
        .queue-name { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); color: white; font-size: 0.65rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; }
        .queue-num { position: absolute; top: 0; left: 0; background: var(--danger); color: white; font-size: 0.8rem; font-weight: bold; padding: 1px 6px; }
        .q-hp-wrap { position: absolute; bottom: 18px; left: 0; width: 100%; height: 5px; background: #333; }
        .q-hp-fill { height: 100%; transition: width 0.3s; }

        /* ВРАГИ */
        #enemies-layer { display: flex; gap: 30px; justify-content: flex-start; align-items: flex-end; opacity: 0; transition: opacity 0.5s; padding-bottom: 10px; overflow-x: visible; }
        #enemies-layer.visible { opacity: 1; }
        .enemy-card { min-width: 270px; width: 270px; height: 380px; background: #000; border: 2px solid #500; border-radius: 8px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 10px 20px rgba(0,0,0,0.8); transition: transform 0.1s; }
        .enemy-card.dead { filter: grayscale(100%); opacity: 0.5; border-color:#333; }
        .enemy-card.dead::after { content: 'ТРУП'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); color: #c0392b; font-size: 4rem; font-weight: 900; border: 5px solid #c0392b; padding: 5px 15px; z-index: 50; }
        .enemy-bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .enemy-overlay { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.95) 40%, rgba(0,0,0,0.6) 90%, transparent 100%); padding: 10px; box-sizing: border-box; z-index: 10; border-top: 1px solid #444; }
        .enemy-name { font-weight: bold; color: #e74c3c; font-size: 1.5rem; text-shadow: 2px 2px 4px black; text-transform: uppercase; line-height: 1.1; margin-bottom: 5px; }
        .hp-bar-cont { width: 100%; height: 30px; background: #111; border: 1px solid #555; border-radius: 4px; overflow: hidden; position: relative; margin-bottom: 8px; }
        .hp-fill { height: 100%; background: #c0392b; transition: width 0.3s; }
        .hp-txt { position: absolute; width: 100%; text-align: center; font-size: 1.1rem; line-height: 30px; color: white; text-shadow: 1px 1px 2px black; font-weight: bold; top:0; }
        .stat-row { display: flex; gap: 5px; }
        .stat-badge { flex: 1; background: rgba(0,0,0,0.6); border: 1px solid #555; text-align: center; font-size: 0.9rem; padding: 6px; border-radius: 3px; font-weight: bold; color: #ccc; }
        .enemy-num { position: absolute; top: 10px; left: 10px; background: var(--danger); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.4rem; border: 2px solid white; z-index: 20; box-shadow: 0 2px 5px black; }
        .aggro-display { color: #f39c12; font-size: 1rem; font-weight: bold; margin-bottom: 5px; text-shadow: 1px 1px 2px black; }

        /* FX */
        #fx-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2000; display: flex; justify-content: center; align-items: center; }
        
        @keyframes shakeRed { 0% { transform: translate(0, 0); } 10%, 90% { transform: translate(-5px, 0); border-color: red !important; box-shadow: 0 0 60px red !important; } 20%, 80% { transform: translate(5px, 0); } 30%, 50%, 70% { transform: translate(-5px, 0); } 40%, 60% { transform: translate(5px, 0); } 100% { transform: translate(0, 0); border-color: inherit; box-shadow: inherit; } }
        @keyframes pulseGreen { 0% { transform: scale(1); } 50% { transform: scale(1.05); border-color: #2ecc71 !important; box-shadow: 0 0 60px #2ecc71 !important; } 100% { transform: scale(1); border-color: inherit; box-shadow: inherit; } }
        @keyframes pulseBlue { 0% { transform: scale(1); } 50% { transform: scale(1.05); border-color: #2980b9 !important; box-shadow: 0 0 60px #2980b9 !important; } 100% { transform: scale(1); border-color: inherit; box-shadow: inherit; } }

        .anim-shake-red { animation: shakeRed 0.6s cubic-bezier(.36,.07,.19,.97) both; }
        .anim-pulse-green { animation: pulseGreen 0.6s ease-in-out; }
        .anim-pulse-blue { animation: pulseBlue 0.6s ease-in-out; }

        .card-float-dmg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; font-weight: 900; color: white; -webkit-text-stroke: 4px black; text-shadow: 0 0 30px red; z-index: 100; animation: cardFloatUp 1.5s forwards; }
        .card-float-heal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; font-weight: 900; color: #2ecc71; -webkit-text-stroke: 4px black; text-shadow: 0 0 30px #2ecc71; z-index: 100; animation: cardFloatUp 1.5s forwards; }
        .card-float-mana { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; font-weight: 900; color: #2980b9; -webkit-text-stroke: 4px black; text-shadow: 0 0 30px #2980b9; z-index: 100; animation: cardFloatUp 1.5s forwards; }

        @keyframes cardFloatUp { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 20% { transform: translate(-50%, -100%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -200%) scale(1); opacity: 0; } }
        
        .spinning-dice-icon { width: 250px; height: 250px; object-fit: contain; filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8)); animation: spinDice 0.5s linear infinite; }
        .dice-result-box { width: 300px; height: 400px; background: #2c2c2e; border: 5px solid #aaa; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 0 50px rgba(0,0,0,0.9); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: auto; }
        .dice-result-box.atk { border-color: #c0392b; box-shadow: 0 0 60px rgba(192, 57, 43, 0.8); }
        .dice-result-box.def { border-color: #2980b9; box-shadow: 0 0 60px rgba(41, 128, 185, 0.8); }
        .dice-result-box.skill { border-color: #f39c12; box-shadow: 0 0 60px rgba(243, 156, 18, 0.8); }
        .dice-label { font-size: 1.5rem; color: #aaa; text-transform: uppercase; margin-bottom: 10px; }
        .dice-who { font-size: 1.8rem; font-weight:bold; color: #fff; margin-bottom: 15px; text-align: center; text-transform: uppercase; text-shadow: 0 2px 5px black; }
        .dice-value { font-size: 8rem; font-weight: 900; color: white; line-height: 1; margin-bottom: 10px; }
        .dice-outcome { font-size: 1.5rem; font-weight: bold; text-transform: uppercase; }
        .dice-crit { color: #e67e22; text-shadow: 0 0 30px #e67e22; animation: pulse 0.5s infinite; }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        @keyframes spinDice { 0% { transform: rotate(0deg) scale(1); } 100% { transform: rotate(360deg) scale(1); } }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .loot-popup { background: #222; border: 4px solid #ffd700; padding: 20px; border-radius: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; box-shadow: 0 0 40px rgba(255, 215, 0, 0.5); animation: popIn 0.3s; color: white; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-title">🎥 STREAM CLIENT</div>
        <input type="text" id="room-id" class="login-input" placeholder="НАЗВАНИЕ КОМНАТЫ" value="GAME1">
        <input type="text" id="room-pass" class="login-input" placeholder="ПАРОЛЬ (ЕСЛИ ЕСТЬ)">
        <button class="btn-connect" onclick="connectStream()">ПОДКЛЮЧИТЬ</button>
    </div>

    <div id="main-stage">
        <video id="bg-video" autoplay loop muted playsinline></video>
        
        <div class="stream-header">
            <div class="header-version">STREAM CL v4.1 (VIDEO+MANA)</div>
            <div class="header-title-container">
                <h1 class="header-title">🏰 Старый Гривенсбург <span id="scenario-tag" class="scenario-tag">...</span></h1>
            </div>
        </div>

        <div class="round-display" id="roundDisplay">
            <span style="color:var(--accent)">РАУНД</span> <span id="round-num">1</span>
        </div>

        <div id="game-area">
            <div id="party-layer"></div>
            <div id="queue-layer"><div class="queue-strip" id="queue-list"></div></div>
            <div id="enemies-layer"></div>
        </div>
    </div>

    <div id="fx-layer"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, onChildAdded, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyDfKmI0xAgmZRk0BXSpt7wxQ49ADo89LtE", authDomain: "grivensburg-project.firebaseapp.com", databaseURL: "https://grivensburg-project-default-rtdb.europe-west1.firebasedatabase.app", projectId: "grivensburg-project", storageBucket: "grivensburg-project.firebasestorage.app", messagingSenderId: "633147062990", appId: "1:633147062990:web:dfffdd0f6a651486efae9f" };
    const app = initializeApp(firebaseConfig); const db = getDatabase(app);
    const GITHUB_URL = 'https://drdrum666.github.io/grivensburg-project/';

    // ГЛАВНЫЙ ФОН (ЗАГЛУШКА 16:9)
    const DEFAULT_BG = 'https://raw.githubusercontent.com/drdrum666/grivensburg-project/main/assets/backs/dashbord_top_16_9.png';

    // СЛОВАРЬ ФОНОВ (BACKUP)
    const SCENARIOS = {
        'default': DEFAULT_BG,
        'dungeon': 'https://raw.githubusercontent.com/drdrum666/grivensburg-project/main/assets/backs/dungeon_cell.png',
        'sewer': 'https://raw.githubusercontent.com/drdrum666/grivensburg-project/main/assets/backs/battle_sewerage_dh.png',
        'sewer_boss': 'https://raw.githubusercontent.com/drdrum666/grivensburg-project/main/assets/backs/battle_sewerage_boss_dh.png',
        'forest': 'https://raw.githubusercontent.com/drdrum666/grivensburg-project/main/assets/backs/battle_dark_forrest_dh.png',
        'graff': 'https://raw.githubusercontent.com/drdrum666/grivensburg-project/main/assets/backs/battle_graff_dh.png',
        'tavern': 'https://raw.githubusercontent.com/drdrum666/grivensburg-project/main/assets/backs/Tavern_inside.jpg'
    };

    let currentRoom = ""; let activePlayers = {}; let activeEnemies = {};
    let previousEnemiesState = {}; let previousPlayersState = {};
    const xpTable = [0, 1000, 2500, 5200, 9200, 14700, 21700, 30200, 40200, 52200, 66200, 82200, 100200, 121200, 145200, 172200, 202200, 237200, 277200, 322200];
    const racesDB = { human: { name: "Человек", str: 0, agi: 0, int: 0 }, orc: { name: "Орк", str: 0, agi: 0, int: 0 }, drow: { name: "Тёмный Эльф", str: 0, agi: 0, int: 0 } };
    const classesDB = { warrior: { name: "Воин", str: 5, agi: 3, int: 2, atk: 0 }, archer: { name: "Лучник", str: 2, agi: 5, int: 3, atk: 0 }, mage: { name: "Маг", str: 2, agi: 2, int: 5, atk: 0 }, priest: { name: "Жрец", str: 2, agi: 2, int: 5, atk: 0 } };

    window.connectStream = async function() {
        const input = document.getElementById('room-id').value.toUpperCase().trim();
        const inputPass = document.getElementById('room-pass').value.trim();
        if(!input) return;
        try {
            const configRef = ref(db, `rooms/${input}/config`);
            const snapshot = await get(configRef);
            if (snapshot.exists()) {
                const config = snapshot.val();
                if (config.password && config.password !== inputPass) return alert("⛔ НЕВЕРНЫЙ ПАРОЛЬ!");
            }
        } catch(e) { console.error(e); }
        currentRoom = input; document.getElementById('login-screen').style.display = 'none'; initStream();
    }

    function initStream() {
        // --- УМНАЯ ЛОГИКА ФОНОВ (IMAGE / VIDEO) ---
        onValue(ref(db, `rooms/${currentRoom}/stream/config`), (snap) => {
            const conf = snap.val();
            let finalUrl = DEFAULT_BG; // Сначала ставим заглушку

            if(conf && conf.bg && conf.bg !== 'default') {
                let bgKey = conf.bg;
                if (SCENARIOS[bgKey]) finalUrl = SCENARIOS[bgKey]; // Из словаря
                else if (bgKey.startsWith('http')) finalUrl = bgKey; // Прямая ссылка
                else if (bgKey.startsWith('assets/')) finalUrl = GITHUB_URL + bgKey; // Путь к файлу
            }

            const video = document.getElementById('bg-video');
            const stage = document.getElementById('main-stage');

            // Проверяем расширение файла
            if (finalUrl.match(/\.(mp4|webm)$/i)) {
                // ЭТО ВИДЕО
                stage.style.backgroundImage = 'none';
                video.src = finalUrl;
                video.style.display = 'block';
                video.play().catch(e => console.log("Autoplay blocked:", e));
            } else {
                // ЭТО КАРТИНКА
                video.style.display = 'none';
                video.pause();
                stage.style.backgroundImage = `url('${finalUrl}')`;
            }

            document.getElementById('scenario-tag').innerText = (conf && conf.title) ? `| ${conf.title}` : "";
        });

        // СЛОИ
        onValue(ref(db, `rooms/${currentRoom}/stream/layers`), (snap) => {
            const layers = snap.val() || { party: false, combat: false };
            const pLayer = document.getElementById('party-layer');
            if (layers.party) pLayer.classList.add('visible'); else pLayer.classList.remove('visible');
            const qLayer = document.getElementById('queue-layer');
            const eLayer = document.getElementById('enemies-layer');
            const rDisp = document.getElementById('roundDisplay');
            if (layers.combat) { qLayer.classList.add('visible'); eLayer.classList.add('visible'); rDisp.classList.add('visible'); } 
            else { qLayer.classList.remove('visible'); eLayer.classList.remove('visible'); rDisp.classList.remove('visible'); }
        });

        onValue(ref(db, `rooms/${currentRoom}/battle/round`), (snap) => { document.getElementById('round-num').innerText = snap.val() || 1; });
        
        onValue(ref(db, `rooms/${currentRoom}/battle/queue`), (snap) => {
            const cont = document.getElementById('queue-list'); cont.innerHTML = ""; let q = snap.val(); if(!q) return; if(!Array.isArray(q)) q = Object.values(q);
            q.forEach(item => {
                if(item.type === 'enemy' && activeEnemies[item.id] && activeEnemies[item.id].currentHP <= 0) return;
                const div = document.createElement('div'); div.className = `queue-card ${item.type}`;
                let icon = item.icon; let hpPct = 100; let hpCol = '#2ecc71';
                if(item.type === 'player' && activePlayers[item.id]) { const p = activePlayers[item.id]; icon = `${GITHUB_URL}assets/heroes/${p.cls}_${p.gender}_${p.race}_base.png`; hpPct = (p.hp/p.maxHP)*100; } 
                else if(item.type === 'enemy' && activeEnemies[item.id]) { const e = activeEnemies[item.id]; hpPct = (e.currentHP/e.maxHP)*100; }
                if(hpPct < 50) hpCol = '#f1c40f'; if(hpPct < 25) hpCol = '#c0392b';
                div.innerHTML = `<img src="${icon}"><div class="q-hp-wrap"><div class="q-hp-fill" style="width:${hpPct}%; background:${hpCol};"></div></div><div class="queue-name">${item.name}</div>${item.number ? `<div class="queue-num">${item.number}</div>` : ''}`;
                cont.appendChild(div);
            });
        });

        // ИГРОКИ (С АНИМАЦИЕЙ HP И MANA)
        onValue(ref(db, `rooms/${currentRoom}/players`), (snap) => {
            const data = snap.val() || {};
            Object.entries(data).forEach(([pid, p]) => {
                if (previousPlayersState[pid]) {
                    // HP Check
                    const diffHP = p.hp - previousPlayersState[pid].hp;
                    if (diffHP !== 0) setTimeout(() => { const card = document.getElementById(`target-player-${pid}`); if (card) triggerVisualFX(card, diffHP, 'hp'); }, 50);
                    
                    // MP Check (NEW!)
                    const diffMP = (p.mp || 0) - (previousPlayersState[pid].mp || 0);
                    if (diffMP > 0) setTimeout(() => { const card = document.getElementById(`target-player-${pid}`); if (card) triggerVisualFX(card, diffMP, 'mana'); }, 150); // Чуть позже HP
                }
            });
            previousPlayersState = JSON.parse(JSON.stringify(data)); activePlayers = data;
            
            const cont = document.getElementById('party-layer'); cont.innerHTML = ""; let idx = 1;
            Object.entries(activePlayers).forEach(([pid, p]) => {
                const bgImg = `${GITHUB_URL}assets/heroes/${p.cls}_${p.gender}_${p.race}_base.png`;
                const isDead = p.hp <= 0;
                const raceData = racesDB[p.race||'human']; const classData = classesDB[p.cls||'warrior'];
                const bStr = p.str || (raceData.str + classData.str); const bAgi = p.agi || (raceData.agi + classData.agi); const bInt = p.int || (raceData.int + classData.int);
                const dispAtk = (p.stats && p.stats.atk !== undefined) ? p.stats.atk : 0; const dispDef = (p.stats && p.stats.def !== undefined) ? p.stats.def : 0; const dispInit = (p.stats && p.stats.init !== undefined) ? p.stats.init : 0;
                let level = 1; const xp = p.xp || 0; for(let i=0; i<xpTable.length; i++) { if(xp >= xpTable[i]) level = i + 1; else break; } if(level > 20) level = 20;
                let xpPct = 0; if (level >= 20) { xpPct = 100; } else { let prevT = xpTable[level - 1]; let nextT = xpTable[level]; let xpInLevel = xp - prevT; let xpNeeded = nextT - prevT; xpPct = Math.min(100, (xpInLevel / xpNeeded) * 100); }

                const wrapper = document.createElement('div'); wrapper.className = "player-wrapper";
                wrapper.innerHTML = `<div class="card ${isDead ? 'dead' : ''}" id="target-player-${pid}"><img src="${bgImg}" class="card-bg-full"><div class="card-overlay-bottom"><div class="xp-bar-stream"><div class="xp-fill-stream" style="width:${xpPct}%"></div></div><div class="h-name">${p.name} <span style="color:#ffd700;font-size:0.8rem;">L${level}</span></div><div class="h-sub">${classData.name}</div><div class="vitals-row"><div class="control-group"><span class="val-display hp-text">${p.hp}/${p.maxHP}</span></div><div class="control-group"><span class="val-display mp-text">${p.mp}/${p.maxMP}</span></div><div class="control-group"><span class="val-display gold-text">💰${p.gold}</span></div></div><div class="db-stats-container"><div class="db-stat-col"><div class="db-stat-box"><span>СИЛ</span><span>${bStr}</span></div><div class="db-stat-box"><span>ЛОВ</span><span>${bAgi}</span></div><div class="db-stat-box"><span>ИНТ</span><span>${bInt}</span></div></div><div class="db-stat-col"><div class="db-stat-box" style="border-color:var(--danger);"><span>АТК</span><span>${dispAtk}</span></div><div class="db-stat-box" style="border-color:var(--mana);"><span>ЗАЩ</span><span>${dispDef}</span></div><div class="db-stat-box" style="border-color:var(--accent);"><span>ИНИ</span><span>${dispInit}</span></div></div></div></div></div><div class="player-name-tag">${p.name}</div>`;
                cont.appendChild(wrapper); idx++;
            });
        });

        // ВРАГИ (С АНИМАЦИЕЙ)
        onValue(ref(db, `rooms/${currentRoom}/enemies`), (snap) => {
            const data = snap.val() || {};
            Object.entries(data).forEach(([eid, e]) => {
                if (previousEnemiesState[eid]) {
                    const diff = e.currentHP - previousEnemiesState[eid].currentHP;
                    if (diff !== 0) setTimeout(() => { const card = document.getElementById(`target-enemy-${eid}`); if (card) triggerVisualFX(card, diff, 'hp'); }, 50);
                }
            });
            previousEnemiesState = JSON.parse(JSON.stringify(data)); activeEnemies = data;

            const cont = document.getElementById('enemies-layer'); cont.innerHTML = "";
            Object.entries(activeEnemies).forEach(([eid, e]) => {
                const isDead = e.currentHP <= 0;
                const pct = (e.currentHP / e.maxHP) * 100;
                const col = pct>50?'#2ecc71':(pct>20?'#f1c40f':'#e74c3c');
                let target = "💤"; if(e.aggroTargetId && activePlayers[e.aggroTargetId]) target = `🎯 ${activePlayers[e.aggroTargetId].name}`; else if(e.aggroReason) target = "🔎 ...";
                const card = document.createElement('div'); card.className = `enemy-card ${isDead ? 'dead' : ''}`; card.id = `target-enemy-${eid}`;
                card.innerHTML = `<div class="enemy-num">${e.number}</div><img src="${e.img}" class="enemy-bg-img"><div class="enemy-overlay"><div class="enemy-name">${e.name}</div><div class="aggro-display">${target}</div><div class="hp-bar-cont"><div class="hp-fill" style="width:${pct}%; background:${col};"></div><div class="hp-txt">${e.currentHP}/${e.maxHP}</div></div><div class="stat-row"><div class="stat-badge" style="color:#e74c3c">ATK ${e.atk}</div><div class="stat-badge" style="color:#9b59b6">INIT ${e.init}</div></div></div>`;
                cont.appendChild(card);
            });
        });

        // FX (DICE & LOOT)
        const eventsRef = ref(db, `rooms/${currentRoom}/stream/events`);
        onChildAdded(eventsRef, (snap) => {
            const ev = snap.val(); setTimeout(() => remove(snap.ref), 6000); if(Date.now() - ev.timestamp > 6000) return;
            const layer = document.getElementById('fx-layer');
            if(ev.type === 'dice') {
                const showSpin = ev.subtype === 'ATK' || ev.subtype === 'skill';
                if (showSpin) {
                    const spinContainer = document.createElement('div');
                    let iconUrl = "https://drdrum666.github.io/grivensburg-project/assets/icons/dice_atack_icon.png";
                    if(ev.subtype === 'skill') iconUrl = "https://drdrum666.github.io/grivensburg-project/assets/icons/hunt_knife_icon.png";
                    spinContainer.innerHTML = `<img src="${iconUrl}" class="spinning-dice-icon">`;
                    layer.appendChild(spinContainer); setTimeout(() => { spinContainer.remove(); renderDiceResultBox(ev, layer); }, 1500);
                } else { renderDiceResultBox(ev, layer); }
            }
            else if(ev.type === 'loot') {
                const box = document.createElement('div'); box.className = 'loot-popup';
                box.innerHTML = `<div style="color:#ffd700; font-weight:bold; font-size:1.5rem; margin-bottom:10px;">ПОЛУЧЕН ЛУТ</div><img src="${ev.icon}" style="width:120px; height:120px; object-fit:contain; margin-bottom:10px;"><div style="font-size:2rem; font-weight:bold;">${ev.itemName}</div><div style="color:#aaa;">Владелец: ${ev.ownerName}</div>`;
                layer.appendChild(box); setTimeout(() => box.remove(), 5000);
            }
        });
    }

    function renderDiceResultBox(ev, layer) {
        const box = document.createElement('div');
        let boxClass = 'dice-result-box'; let title = "БРОСОК";
        if (ev.subtype === 'ATK') { boxClass += ' atk'; title = "АТАКА"; } else if (ev.subtype === 'DEF') { boxClass += ' def'; title = "ЗАЩИТА"; } else if (ev.subtype === 'skill') { boxClass += ' skill'; title = "НАВЫК"; }
        box.className = boxClass;
        let valHtml = `<div class="dice-value">${ev.val}</div>`; let outcomeText = ev.outcome || "УСПЕХ";
        if(ev.isCrit) { valHtml = `<div class="dice-value dice-crit">${ev.val}</div>`; outcomeText = `<span style="color:#e67e22">КРИТ!</span>`; } else if (ev.isMiss) { valHtml = `<div class="dice-value" style="color:#7f8c8d">${ev.val}</div>`; outcomeText = `<span style="color:#7f8c8d">ПРОМАХ</span>`; }
        box.innerHTML = `<div class="dice-label">${title}</div><div class="dice-who">${ev.who}</div>${valHtml}<div class="dice-outcome">${outcomeText}</div>`;
        layer.appendChild(box); setTimeout(() => box.remove(), 4000);
    }

    // --- ОБНОВЛЕННАЯ ФУНКЦИЯ FX (HP + MANA) ---
    function triggerVisualFX(cardElement, amountDiff, type = 'hp') {
        cardElement.classList.remove('anim-shake-red', 'anim-pulse-green', 'anim-pulse-blue');
        void cardElement.offsetWidth; 
        const el = document.createElement('div');
        
        if (type === 'mana') {
            // СИНЯЯ АНИМАЦИЯ ДЛЯ МАНЫ
            cardElement.classList.add('anim-pulse-blue');
            el.className = 'card-float-mana';
            el.innerText = `+${amountDiff}`;
        } else {
            // HP
            if (amountDiff < 0) { 
                cardElement.classList.add('anim-shake-red'); 
                el.className = 'card-float-dmg'; 
                el.innerText = `${amountDiff}`; 
            } else { 
                cardElement.classList.add('anim-pulse-green'); 
                el.className = 'card-float-heal'; 
                el.innerText = `+${amountDiff}`; 
            }
        }
        cardElement.appendChild(el); setTimeout(() => el.remove(), 1500);
    }
</script>
</body>
