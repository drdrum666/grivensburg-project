}

/* Раскраска журнала: имена золотом, урон красным, лечение зелёным. */
function colorizeLog(text) {
    return esc(text)
        .replace(/(-\d+)/g, '<span style="color:#e74c3c;font-weight:bold">$1</span>')
        .replace(/(\+\d+)/g, '<span style="color:#2ecc71;font-weight:bold">$1</span>');
}
function renderLog() {
    const cont = $('log-list');
    /* ПРОКРУТКА ВНИЗ — ТОЛЬКО ЕСЛИ ТАМ И БЫЛИ.

       Раньше каждая перерисовка ставила журнал в самый низ. Пока колесо до
       него не доходило, это было незаметно; стоило вернуть прокрутку — и
       отматывать стало бессмысленно: любая новая строка тут же утаскивала
       журнал обратно, а в бою строки идут потоком.

       Считаем «у низа» с запасом в 40 пикселей: попасть колесом ровно в
       ноль нельзя, а читать хвост хочется всем. Отмотал выше — журнал
       стоит и ждёт. */
    const уНиза = cont.scrollHeight - cont.scrollTop - cont.clientHeight < 40;
    cont.innerHTML = S.log.map(l =>
        `<div class="log-entry log-${esc(l.type || 'info')}">${colorizeLog(l.text)}</div>`).join('');
    if (уНиза) cont.scrollTop = cont.scrollHeight;
}

/* ==========================================================================
   7. ЭФФЕКТЫ НА ЭКРАНЕ (броски, лут, победа)
   ========================================================================== */

function floatOn(elementId, diff, kind) {
    const card = $(elementId);
    if (!card) return;
    card.classList.remove('anim-shake-red', 'anim-pulse-green', 'anim-pulse-blue');
    void card.offsetWidth;
    const el = document.createElement('div');
    if (kind === 'mana') {
        card.classList.add('anim-pulse-blue');
        el.className = 'card-float-mana';
        el.innerText = `+${diff}`;
    } else if (diff < 0) {
        card.classList.add('anim-shake-red');
        el.className = 'card-float-dmg';
        el.innerText = String(diff);
    } else {
        card.classList.add('anim-pulse-green');
        el.className = 'card-float-heal';
        el.innerText = `+${diff}`;
    }
    card.appendChild(el);
    setTimeout(() => el.remove(), 1500);
}

/* Честный бросок: прилетает в момент нажатия «кинуть за меня», до того как
   число можно подменить руками. Самый ценный момент за столом. */
/* ЖДЁМ БРОСКА — кубик катится, пока человек вбивает число.

   Раньше кубик показывался ПОСЛЕ подтверждения: зритель видел уже готовый
   результат, а само ожидание выглядело мёртвым экраном. Теперь наоборот —
   кубик крутится с момента, когда открылось окно.

   Ждём столько, сколько актуален бросок. Отмена приходит от владельца
   окна либо от мастера при отзыве операции.  */
let awaitBox = null, awaitDice = [];

function stopAwaiting() {
    awaitDice.forEach(d => { try { d.destroy(); } catch (e) {} });
    awaitDice = [];
    if (awaitBox) { awaitBox.remove(); awaitBox = null; }
}

function showAwaiting(data) {
    if (!data || !data.kind) { stopAwaiting(); return; }
    /* Пришло то же самое ожидание — не перезапускаем, иначе кубик дёргается
       на каждой перерисовке подписки. */
    if (awaitBox && (data.rollId ? awaitBox.dataset.rollId === data.rollId : awaitBox.dataset.at === String(num(data.at)))) return;
    stopAwaiting();

    const layer = $('fx-layer');
    if (!layer) return;
    const box = document.createElement('div');
    box.className = 'await-roll';
    box.dataset.at = String(num(data.at));
    box.dataset.rollId = data.rollId || '';

    const кто = esc(data.who || 'игрок');
    box.innerHTML = `<div class="await-dice"></div>
                     <div class="await-text">🎲 ${кто} бросает…</div>`;
    layer.appendChild(box);
    awaitBox = box;

    /* СТАРОГО КУБИКА ЗДЕСЬ БОЛЬШЕ НЕТ (решение автора 28.09.2026). Он
       крутился в этой рамке, пока ждали бросок, и жил сам по себе: не
       снялось ожидание — вертелся до конца боя; включили 3D — висел над
       новым. Кубик от ожидания до результата ведёт одна система, по
       battle/diceRoll. Здесь только надпись «бросает…». */
}

/* ХРАМ ГЛАЗАМИ ЗРИТЕЛЯ — ЗЕРКАЛО, БЕЗ КНОПОК.

   Открывает храм Ведущий, жертвует жрец, а зритель только смотрит. Но
   смотреть он должен на живую картинку: видеть, куда Ведущий навёл и что
   нажал. Иначе на экране просто застывший алтарь и непонятно, что вообще
   происходит на столе.

   Зоны те же и в тех же процентах, что у Ведущего и в клиенте: рисунок
   один, значит и разметка мест одна. */
let churchBox = null;

function showChurch(c) {
    if (!c || !c.open) {
        if (churchBox) { churchBox.remove(); churchBox = null; }
        return;
    }
    const layer = $('fx-layer');
    if (!layer) return;

    if (!churchBox) {
        churchBox = document.createElement('div');
        churchBox.className = 'church-mirror';
        layer.appendChild(churchBox);
    }

    /* Рисуем ПЕРЕСБОРКОЙ разметки, а не поиском узлов внутри неё.

       Поиск (querySelector) есть у браузера, но не у подставки, на которой
       гоняются прогоны, — и код падал бы прямо в подписке, молча ломая
       весь экран стримера. Пересборка проще и работает везде одинаково.

       Зоны в тех же процентах, что у Ведущего и в клиенте: рисунок один,
       значит и разметка мест одна. */
    const place=k=>`<span class="ch-spot church-urn${c.hover===k?' lit':''}${c.press===k?' hit':''}" style="${window.churchSpots?.[k]?.style||''}">${window.churchSpotArt?.(k)||''}</span>`;
    churchBox.innerHTML=`<div class="ch-head">${esc(c.name||'Храм')} · в общаке ${num(c.gold)} золота</div>
        <div class="ch-art"><img src="${assetUrl('assets/interface/church.webp')}" alt="" onerror="this.style.opacity=.15">${place('humble')}${place('generous')}</div>
        <div class="church-services">${(c.services||[]).map(x=>`<div class="church-service"><strong>${esc(x.name)}</strong><span>${Number.isFinite(x.price)?x.price+' золота':'Цена не назначена'}</span></div>`).join('')}</div>
        ${c.recipient?`<div class="church-payment">${esc(c.recipient)} · ${c.fromVault?'оплата из общака':'личные деньги героя'}</div>`:''}`;

}

/* ТАВЕРНА НА ЭКРАНЕ. Зеркало, как и церковь: стример ничего не решает, он
   показывает присланное. Места — в тех же процентах, что у Ведущего и в
   клиенте: рисунок один, значит и разметка мест одна.

   Рисуем ПЕРЕСБОРКОЙ разметки, а не поиском узлов: querySelector есть у
   браузера, но не у подставки, на которой гоняются прогоны, и код падал бы
   прямо в подписке, молча ломая весь экран. */
let tavernBox = null;

function showTavern(t) {
    if (!t || !t.open) {
        if (tavernBox) { tavernBox.remove(); tavernBox = null; }
        return;
    }
    const layer = $('fx-layer');
    if (!layer) return;

    if (!tavernBox) {
        tavernBox = document.createElement('div');
        tavernBox.className = 'church-mirror';
        layer.appendChild(tavernBox);
    }

    const место = (k, л, т, ш, в) =>
        `<span class="ch-spot${t.hover === k ? ' lit' : ''}${t.press === k ? ' hit' : ''}"
               style="left:${л};top:${т};width:${ш};height:${в};"></span>`;

    /* Подпись говорит, что сейчас выбрано: зритель видит карточку целиком,
       но не видит, во что Ведущий тычет мышью. */
    const цена = t.press === 'room'
        ? ` · комната ${num(t.roomPrice)} с человека, всего ${num(t.roomTotal)}`
        : (t.press === 'provision' ? ` · припасы ${num(t.provisionPrice)}` : '');

    tavernBox.innerHTML =
        `<div class="ch-head">${esc(t.name || 'Таверна')} · в общаке ${num(t.vaultGold)} золота${цена}</div>
         <div class="ch-art">
           <img src="${assetUrl(t.art || 'assets/interface/taverna.webp')}" alt=""
                onerror="this.style.opacity=.15">
           ${место('drinks',    '39.5%', '52%', '15.5%', '25%')}
           ${место('room',      '58%',   '52%', '15.5%', '25%')}
           ${место('provision', '76.5%', '52%', '15.5%', '25%')}
         </div>`;
}

function showLivePreview(data) {
    const box = $('liveNoticeToast');
    if (!data) { box.style.display = 'none'; return; }
    const fresh = Date.now() - num(data.timestamp) < 8000;
    if (!fresh) { box.style.display = 'none'; return; }
    box.innerHTML = data.text
        ? esc(data.text)
        : `🎲 ${esc(data.who || '')} бросает… <b style="font-size:1.3rem">${num(data.roll)}</b>`;
    box.style.display = 'block';
    clearTimeout(showLivePreview._t);
    showLivePreview._t = setTimeout(() => { box.style.display = 'none'; }, 4000);
}

/* Сколько держится карточка в АВТОМАТИЧЕСКОМ режиме. В ручном она висит,
   пока Ведущий не клацнет, и эти числа не участвуют. */
const CARD_FULL_MS  = 3000;   /* удар игрока: много цифр, надо успеть прочесть */
const CARD_BRIEF_MS = 3000;   /* удар врага: только баф и защита */

const seenEvents = new Set();
let eventFloor = '';
function rememberId(set, id) {
    set.add(id);
    if (set.size > 1024) set.delete(set.values().next().value);
}

function handleEvents(all) {
    const keys = Object.keys(all || {}).sort().slice(-512);
    const list = keys.map(k => ({ key: k, ev: all[k] }))
        .sort((a, b) => num(a.ev.timestamp) - num(b.ev.timestamp));

    /* При заходе в комнату старые события не проигрываем — иначе зрители
       увидят весь прошлый бой пачкой. Отметку ставим на ПЕРВОМ ответе базы,
       даже если он пустой: иначе первое же событие сочтётся старым и пропадёт. */
    if (firstEventsBatch) {
        list.forEach(x => { rememberId(seenEvents, x.key); const k = rollEventKey(x.ev); if (k) rememberId(seenRollEvents, k); });
        if (keys.length) eventFloor = keys[0];
        firstEventsBatch = false;restoreManualResults();
        return;
    }
    if (!list.length) return;
    list.forEach(({ key, ev }) => {
        if (key < eventFloor || seenEvents.has(key)) return;
        rememberId(seenEvents, key);rememberId(restoredResultCards,key);
        enqueue({...ev,eventId:ev.eventId || key});
    });
    if (keys.length === 512 && keys[0] > eventFloor) eventFloor = keys[0];
}

/* ── ЗВУК У ЗРИТЕЛЕЙ ────────────────────────────────────────────────
   Стример музыкой не управляет — это дело мастера. Здесь только глушилка
   и приглушение под звуки: во время броска музыка становится тише и сама
   возвращается, а не обрывается. */
let MUTED = false;

/* ПРИЁМНИК МУЗЫКИ. Звук идёт ОТСЮДА: стример на телевизоре, его слышит
   стол. Начинает с intro, затем принимает новые команды мастера.
   В базу отсюда не пишется ни байта. */

let STREAM_MUSIC = null;
const SINK = (typeof makeMusicSink === 'function') ? makeMusicSink({
    onEnded: () => { if (STREAM_MUSIC) STREAM_MUSIC.ended(); },
    /* Браузер отказал в звуке — говорим об этом НА ЭКРАНЕ. Раньше отказ
       уходил в никуда, и «музыка не играет» было без объяснений. */
    onBlocked: () => {
        soundFree = false; armUnblock();
        const b = document.getElementById('muteBtn');
        if (b) { b.textContent = MUTED ? '🔇 Включить звук' : '🔊 Выключить звук'; b.title = 'Браузер не пустил звук без клика'; b.classList.add('needs-unlock'); }
    },
    /* Файл не найден — пишем ПРЯМО НА ЭКРАН. Иначе «музыка не играет»
       остаётся без причины, а причина обычно одна: имя файла не то. */
    onError: msg => {
        const b = document.getElementById('muteBtn');
        if (b) { b.textContent = MUTED ? '🔇 Включить звук' : '🔊 Выключить звук'; b.title = 'Музыка ' + msg; }
        let n = document.getElementById('musicErr');
        if (!n) {
            n = document.createElement('div');
            n.id = 'musicErr';
            n.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:9999;' +
                'background:rgba(120,20,20,.92);color:#fff;font:12px sans-serif;' +
                'padding:6px 10px;border-radius:6px;max-width:60vw';
            document.body.appendChild(n);
        }
        n.textContent = 'Музыка ' + msg;
    }
}) : null;

/* КАРТОЧКА ПЕСНИ.

   Раньше на песне крутилась только иконка ножа и всё: стол видел, что бард
   что-то сделал, но ЧТО именно и чем кончилось — не видел ни на удаче, ни
   на промахе. А промах и вовсе не доезжал до телевизора: клиент выходил
   молча, и со стороны бард просто замирал на своём ходу.

   Карточка одна на оба случая. Слова приходят готовыми с телефона — исход
   считает движок, стример его не толкует. Промах красный, виртуоз золотой,
   остальное обычное.

   Показывается ТОЛЬКО у песни: у других бросков subtype `skill` нет своего
   текста, и пустая рамка была бы хуже, чем ничего. */
function songCard(ev, layer, done) {
    const текст = String((ev && ev.outcome) || '');
    /* ТОЛЬКО ПЕСНЯ. Функцию зовут после КАЖДОГО броска, и раньше она рисовала
       табличку для любого события с исходом — подписывая его словом «Песня».
       А для защиты рисовала отдельную таблицу, хотя дашборд следом шлёт свою
       карточку защиты — с выкинутым, итогом, прибавкой и уроном. За столом
       это были две карточки одного броска.

       Итог любого броска показывает ОДНА карточка с дашборда. Здесь остаётся
       только песня: у неё карточки итога нет. */
    if (!текст || !layer || !ev.song) { done(); return; }

    const промах = /Мимо/i.test(текст);
    const box = document.createElement('div');
    box.className = 'loot-popup';
    if (ev.isCrit) box.style.borderColor = '#ffd700';
    else if (промах) box.style.borderColor = '#a33';
    box.innerHTML =
        `<div style="color:${промах ? '#e77' : '#ffd700'}; font-weight:bold;` +
        ` font-size:1.4rem; margin-bottom:8px;">🎵 ${esc(ev.song || 'Песня')}</div>` +
        `<div style="font-size:1.9rem; font-weight:bold;">${esc(текст)}</div>` +
        `<div style="color:#aaa; margin-top:6px;">${esc(ev.who || '')}</div>`;
    layer.appendChild(box);
    setTimeout(() => { box.remove(); done(); }, промах ? 2200 : 3000);
}

/* ДЖИНГЛ УМЕНИЯ.

   Звук идёт С ТЕЛЕВИЗОРА — его слышит весь стол. Раньше джингла здесь не
   было вовсе: стример умел только фоновую музыку, песня барда приезжала
   карточкой и показывалась молча. На телефоне джингл играл лишь у самого
   барда и лишь с включённой галочкой, так что за столом его не слышал
   никто.

   ВЫБОР СДЕЛАН НЕ ЗДЕСЬ. Адрес присылает телефон готовой строкой, железное
   правило 7 цело. Полей два: запись с полом лежит в подпапке, которой пока
   нет, — на ней спотыкаемся и берём общий вариант на расу.

   ПОД ДЖИНГЛ МУЗЫКА СТАНОВИТСЯ ВДВОЕ ТИШЕ и возвращается плавно, когда он
   отзвучал. Отпускаем по настоящему концу файла, а не по таймеру: джинглы
   разной длины, и короткий оставил бы музыку приглушённой впустую. */
let JINGLE = null;
/* Файлы, которых на гитхабе нет. Запомнили — в следующий раз сразу берём
   общий, не ждём ошибки. Живёт до перезагрузки страницы. */
const НЕТ_ФАЙЛА = new Set();

/* ДЖИНГЛ БАРДА — С НАДЁЖНЫМ ЗАПАСНЫМ ПУТЁМ.

   Телефон шлёт два адреса: запись с полом и общую. Записей с полом на
   гитхабе сейчас почти нет — ни женских, ни многих мужских, — так что
   играет почти всегда общая. Раньше переход на неё был хрупким: запасной
   файл ставился в ТОТ ЖЕ сломанный звуковой элемент, а отказ первого
   воспроизведения тут же снимал приглушение музыки. Теперь запасной файл
   играет НОВЫЙ элемент, а отсутствующие файлы запоминаются. */
function playJingle(url, alt) {
    if (JINGLE) { try { JINGLE.pause(); } catch (e) {} JINGLE = null; }
    if (!url && !alt) return;
    /* Зритель выключил звук — значит тихо всё, включая джингл. */
    if (MUTED) return;

    const очередь = [url, alt].filter((x, k, м) => x && м.indexOf(x) === k && !НЕТ_ФАЙЛА.has(x));
    if (!очередь.length) { нетФайла(url || alt); return; }

    /* Потолок на случай, когда конца не будет вовсе: браузер не пустил звук,
       вкладку свернули. Без него музыка осталась бы тихой до конца вечера. */
    if (SINK) SINK.duck(12000);

    const пробовать = (k) => {
        const src = очередь[k];
        const a = new Audio(src);
        JINGLE = a; a.volume=screenPrefs().volume/100; a.muted=MUTED;
        const вернуть = () => {
            if (JINGLE !== a) return;      /* уже сменили на новый — не мешаем */
            JINGLE = null;
            if (SINK) SINK.unduck();
        };
        a.onended = вернуть;
        a.onerror = () => {
            if (JINGLE !== a) return;
            НЕТ_ФАЙЛА.add(src);
            if (k + 1 < очередь.length) { пробовать(k + 1); return; }
            нетФайла(src);
            вернуть();
        };
        const p = a.play && a.play();
        /* Отказ воспроизведения из-за НЕТ ФАЙЛА придёт в onerror — там и
           переход на запасной. Здесь ловим только запрет браузера на звук:
           тогда отпускаем музыку, ждать нечего. */
        if (p && p.catch) p.catch(err => { if (err && err.name === 'NotAllowedError') вернуть(); });
    };
    пробовать(0);
}

/* Дырка честнее подмены: нет файла — называем, какого не хватает. Плашка
   пропадает сама, чтобы не висеть поверх игры весь вечер. */
function нетФайла(url) {
    const имя = String(url || '').split('/').slice(-2).join('/');
    let n = document.getElementById('jingleErr');
    if (!n) {
        n = document.createElement('div');
        n.id = 'jingleErr';
        n.style.cssText = 'position:fixed;left:8px;bottom:44px;z-index:9999;' +
            'background:rgba(120,20,20,.92);color:#fff;font:12px sans-serif;' +
            'padding:6px 10px;border-radius:6px;max-width:60vw';
        document.body.appendChild(n);
    }
    n.textContent = 'Джингл не найден: ' + decodeURIComponent(имя);
    clearTimeout(n.__hide);
    n.__hide = setTimeout(() => n.remove(), 6000);
}

/* РАЗБЛОКИРОВКА ЗВУКА.

   Браузер не пускает звук, пока в окне не нажали. Раньше мы ловили нажатие
   один раз, и этого не хватало: если отказ повторялся (новая вкладка,
   свёрнутое окно, смена трека до первого касания), звук так и оставался
   выключенным, а мастер жал динамик вручную каждый вечер.

   Теперь пробуем при КАЖДОМ нажатии, пока не выйдет, и заодно на возврате
   вкладки — там браузер часто отпускает запрет сам. Обработчики снимаем,
   как только звук пошёл: висеть без дела им незачем. */
let soundFree = false, unblockPending = false, unblockArmed = false;
async function tryUnblock(event) {
    // Кнопка звука обрабатывает один click; touch/pointer/keydown перед ним
    // не должны сначала включить звук, а затем тут же заглушить его.
    if (event && event.type !== 'click' && event.target?.closest?.('#muteBtn')) return;
    if (soundFree || unblockPending || !SINK) return;
    unblockPending = true;
    try {
        const ok = await SINK.unblock();
        if (ok === false || !SINK.state().playing || SINK.state().blocked) return;
        const b = document.getElementById('muteBtn');
        if (b) { b.textContent = MUTED ? '🔇 Включить звук' : '🔊 Выключить звук'; b.title = 'Включить / выключить звук'; b.classList.remove('needs-unlock'); }
        soundFree = true; dropUnblock();
    } finally { unblockPending = false; }
}
const UNBLOCK_EVENTS = ['click', 'keydown', 'touchstart', 'pointerdown'];
function armUnblock() {
    if (unblockArmed) return;
    unblockArmed = true;
    UNBLOCK_EVENTS.forEach(ev => document.addEventListener(ev, tryUnblock, { passive:true }));
    document.addEventListener('visibilitychange', onVisible);
}
function dropUnblock() {
    unblockArmed = false;
    UNBLOCK_EVENTS.forEach(ev => document.removeEventListener(ev, tryUnblock));
    document.removeEventListener('visibilitychange', onVisible);
}
function onVisible() { if (!document.hidden) tryUnblock(); }
armUnblock();

/* ГЛУШИТЬ МОЖЕТ И КЛИЕНТ.

   Экран зрителя живёт рамкой внутри телефона: спрятать рамку — не значит
   заткнуть её, она остаётся загруженной и играет дальше. Кнопка в клиенте
   шлёт сюда сообщение, а гасим мы себя сами — тем же путём, что и своей
   кнопкой, чтобы правило было одно.

   Слушаем ТОЛЬКО своё сообщение: чужие постучавшиеся страницы нам не указ. */
window.addEventListener('message', (e) => {
    const d = e && e.data;
    if (e.source!==window.parent || !d || d.type !== 'gb-mute') return;
    updateScreenPrefs({muted:!!d.on});
});

window.toggleMute = () => {
    updateScreenPrefs({muted:!MUTED});
    if(!MUTED)tryUnblock();
};

let resultCardState={},resultStateReady=false,resultConfigReady=false;
const restoredResultCards=new Set();
function resultDismissed(id){return !!id && !!resultCardState.closed?.[id]?.manual;}
function restoreManualResults(){
    if(!resultStateReady || !resultConfigReady || firstEventsBatch || S.autoShow)return;
    for(const entry of Object.values(resultCardState.pending || {}).sort((a,b)=>a.at-b.at || a.id.localeCompare(b.id))) {
        if(restoredResultCards.has(entry.id) || !seenEvents.has(entry.id))continue;
        rememberId(restoredResultCards,entry.id);
        if([...activeResultCards].some(x=>x.resultEventId===entry.id) || playQueue.some(x=>x.eventId===entry.id))continue;
        enqueue({...entry.event,eventId:entry.id,rollId:null,restored:true,presentation:null,sound:undefined});
    }
}
function receiveResultCards(value){
    const changed=resultStateReady && (value?.epoch || '')!==(resultCardState.epoch || '');
    resultCardState=value || {};resultStateReady=true;
    if(changed)resetUndoPresentation();
    for(const box of [...activeResultCards])if(resultDismissed(box.resultEventId))box.finish();
    restoreManualResults();
}
/* --- Очередь показа ------------------------------------------------------
   Раньше события рисовались внахлёст: карточка атаки ещё висела, а поверх
   уже лезла защита — зрители видели «попал», следом «парировал».
   Теперь такты идут строго по одному, следующий ждёт конца предыдущего. */
const playQueue = [];
const seenRollEvents = new Set();
let queueRetry = null;
let playing = false;
let presenting = false;         /* playing включает и ожидание кубика */
let waitingCard = null;          /* карточка результата, ждущая ГМа */
const eventReceivedAt = new WeakMap();
const DICE_COMMAND_GRACE_MS = 1800;

function rollEventKey(ev) {
    if (!ev || !ev.rollId || !['dice', 'result', 'sweep'].includes(ev.type)) return null;
    if (ev.type === 'result' && ev.eventId) return 'result:' + ev.eventId;
    return ev.rollId + ':' + (ev.type === 'dice' ? 'dice' : 'card');
}
function enqueue(ev) {
    const key = rollEventKey(ev);
    if (key && seenRollEvents.has(key)) return;
    if (key) rememberId(seenRollEvents, key);
    /* Новая система: джингл песни звучит СРАЗУ, вместе с кубиком, а не
       после его показа — событие в очереди подождёт, звук ждать не должен. */
    if (DICE_V2 && ev && (ev.type === 'dice' || ev.type === 'result' && ev.kind === 'ability' && ev.song)
        && ev.source === 'client' && ev.sound !== undefined) {
        playJingle(ev.sound, ev.soundAlt);
        ev = Object.assign({}, ev); delete ev.sound; delete ev.soundAlt;
    }
    /* При оставленной ручной карточке очередь тоже конечна. Это только
       показ: расчёт боя и игровой журнал не удаляются. */
    if (playQueue.length >= 256) { playQueue.shift(); console.warn('Очередь стрима переполнена: пропущен самый старый показ.'); }
    // Warm the outcome art while dice settle; mounting still waits for decode.
    if (ev.card) { const image = new Image(); image.src = ev.card; }
    eventReceivedAt.set(ev, Date.now());
    playQueue.push(ev);
    // Новый результат ждёт закрытия текущего в ручном режиме.
    if (!playing) nextInQueue();
}

/* ══════════════════════════════════════════════════════════════════════
   КУБИКИ СТРИМА — ОДНА СИСТЕМА (ТЗ, этап II; с 28.09.2026 — единственная).

   Ведущий в дашборде выбирает шкурку: stream/config/dice {enabled, mode}.
   Выключено — лёгкая шкурка по умолчанию, включено — выбранная. Старого
   плоского кубика больше нет.

   Бросок приходит по battle/diceRoll {rollId, phase: rolling|resolved|
   cancelled, die: d20|2d10, faces}. Одна фаза одного rollId — один раз;
   более ранняя фаза не возвращает завершённый бросок назад. Позы по сети
   не ходят — только команды.
   ══════════════════════════════════════════════════════════════════════ */
let DICE_V2 = null;
let diceV2Settings = {};
let diceV2ActiveSkinKey = null;
let diceV2PendingSkin = null;
let diceV2PrepareId = null;
/* Размер примеряется отдельной стоковой шкуркой, вне очереди боевых бросков. */
let diceSizeController = null, diceSizePreviewId = null, diceSizePreviewDie = null, diceSizeExpiry = null;
function stopDiceSizePreview() {
    clearTimeout(diceSizeExpiry); diceSizeExpiry = null;
    if (diceSizeController) diceSizeController.dispose();
    diceSizeController = null; diceSizePreviewId = null; diceSizePreviewDie = null;
}
function onDiceSizePreview(v) {
    const remaining = Number(v?.expiresAt) - Date.now();
    if (!v?.active || !v.id || !Number.isFinite(remaining) || remaining <= 0
        || !window.DiceController || !window.DicePhysics
        || presenting || (DICE_V2 && (DICE_V2.phase !== 'idle' || DICE_V2.pendingRollId))
        || diceLatest?.phase === 'rolling') { stopDiceSizePreview(); return; }
    const die = Number(v.die) === 10 ? 10 : 20;
    if (diceSizePreviewId !== v.id || diceSizePreviewDie !== die) {
        stopDiceSizePreview();
        const selected = window.DiceController.effectiveConfig(v.config || diceV2Settings);
        let controller = null;
        controller = window.DiceController.attachToPage({ container:$('dice-v2-layer'),
            skins:{20:diceSkinUrl(20,selected),10:diceSkinUrl(10,selected)},
            onEvent:e => { if (e.type === 'skin-status' && e.state === 'error') setTimeout(() => {
                if (diceSizeController === controller) stopDiceSizePreview();
            },0); }
        });
        diceSizeController = controller; diceSizePreviewId = v.id; diceSizePreviewDie = die;
        controller.start({ rollId:'preview-'+v.id, die, preview:true, size:v.size });
    } else diceSizeController.setPreviewSize(v.size);
    clearTimeout(diceSizeExpiry);
    diceSizeExpiry = setTimeout(stopDiceSizePreview, Math.min(120000,remaining));
}
const diceV2Seen = Object.create(null);           /* rollId → ранг фазы */
const diceV2SeenOrder = new Set();
function rememberDice(id, rank) {
    diceV2Seen[id] = rank; diceV2SeenOrder.add(id);
    if (diceV2SeenOrder.size > 1024) {
        const old = diceV2SeenOrder.values().next().value;
        diceV2SeenOrder.delete(old); delete diceV2Seen[old];
    }
}
/* Шкурка не ответила (нет файла на гитхабе) — кубики сдаются, и стример
   идёт без них, пока Ведущий не переключит кубики или шкурку. */
let diceV2Failed = false;
let diceSnapshotSeen = false;
let diceLatest = null;
let diceGeneration = 0;
const ФАЗА = { rolling: 1, resolved: 2, cancelled: 2 };

function diceSkinUrl(die, config = diceV2Settings) {
    return window.DiceController.skinUrl(config, die, window.GITHUB_URL || '');
}
function discardPendingSkin() {
    if (diceV2PendingSkin) diceV2PendingSkin.controller.dispose();
    diceV2PendingSkin = null;
}
function swapPreparedSkin() {
    const pending = diceV2PendingSkin;
    if (!pending || !pending.controller.ready(20) || !pending.controller.ready(10)
        || (DICE_V2 && (DICE_V2.phase !== 'idle' || DICE_V2.pendingRollId))) return;
    if (DICE_V2) DICE_V2.dispose();
    DICE_V2 = pending.controller; diceV2ActiveSkinKey = pending.key; diceV2PendingSkin = null;
    DICE_V2.setBlocked(presenting);
}
function createDiceController(skins) {
    let controller = null;
    controller = window.DiceController.attachToPage({ container:$('dice-v2-layer'), skins, hold:1,
        onEvent:e => {
            if (e.type === 'cache-status' && e.state === 'unavailable') console.warn(e.message);
            if (e.type === 'skin-status' && e.state === 'error') setTimeout(() => {
                if (controller === DICE_V2) diceV2GiveUp(e.die, e.message);
                else if (controller === diceV2PendingSkin?.controller) {
                    discardPendingSkin(); console.warn('Новая шкурка не готова: ' + e.message + '. Сохранена прежняя.');
                }
            }, 0);
            if ((e.type === 'skin-status' && e.state === 'ready') || (e.type === 'phase' && e.phase === 'idle'))
                setTimeout(swapPreparedSkin, 0);
            if (controller === DICE_V2 && (e.type === 'result-ready' || e.type === 'center-clear' || (e.type === 'phase' && e.phase === 'idle')))
                nextInQueue();
        }
    });
    controller.setBlocked(presenting);
    return controller;
}
/* КУБИКИ ЕСТЬ ВСЕГДА (решение автора 28.09.2026). Выключены «Кубики 3D» —
   не пустота и не старый плоский кубик, а лёгкая шкурка этой же системы;
   включены — выбранная Ведущим. Какую брать, решает DiceController
   (effectiveConfig): одно правило на стример и дашборд. */
let diceV2WasEnabled = null;
function diceV2Config(c) {
    const enabled = !!(c && c.enabled);
    const prepareId = (c && c.prepareId) || null;
    if (prepareId && prepareId !== diceV2PrepareId) diceV2Failed = false;
    /* Переключили 3D — шкурка другая, прошлая неудача не в счёт. */
    if (enabled !== diceV2WasEnabled) { diceV2Failed = false; diceGeneration++; }
    diceV2WasEnabled = enabled;
    diceV2PrepareId = prepareId;
    diceV2Settings = JSON.parse(JSON.stringify(window.DiceController && window.DiceController.effectiveConfig
        ? window.DiceController.effectiveConfig(c) : (c || {})));
    if (!window.DiceController || !window.DicePhysics || diceV2Failed) return;
    let skins;
    try { skins = {20:diceSkinUrl(20), 10:diceSkinUrl(10)}; }
    catch (e) { console.warn(e.message); return; }
    const key = JSON.stringify(skins);
    if (!DICE_V2) {
        DICE_V2 = createDiceController(skins); diceV2ActiveSkinKey = key;
        DICE_V2.ensureFrames(20); DICE_V2.ensureFrames(10);
        if (diceLatest && diceLatest.phase === 'rolling') {
            delete diceV2Seen[diceLatest.rollId]; onDiceRoll(diceLatest);
        }
    } else if (key === diceV2ActiveSkinKey) discardPendingSkin();
    else if (key !== diceV2PendingSkin?.key) {
        discardPendingSkin();
        const controller = createDiceController(skins);
        diceV2PendingSkin = { controller, key };
        controller.ensureFrames(20); controller.ensureFrames(10);
        swapPreparedSkin();
    }
}
function pendingDiceIds() { return DICE_V2?.pendingRollIds || (DICE_V2?.pendingRollId ? [DICE_V2.pendingRollId] : []); }
function hasDiceRoll(id) { return !!DICE_V2 && (DICE_V2.hasRoll ? DICE_V2.hasRoll(id) : DICE_V2.rollId === id || pendingDiceIds().includes(id)); }
function onDiceRoll(v) {
    if (v?.rollId && ['rolling','resolved'].includes(v.phase)) stopDiceSizePreview();
    const initial = !diceSnapshotSeen;
    diceSnapshotSeen = true; diceLatest = v;
    if (!v || !v.rollId) {
        if (!v && DICE_V2) {
            /* Очистка узла после расчёта не обрывает подтверждённый показ. */
            [DICE_V2.rollId, ...pendingDiceIds()].filter(Boolean).forEach(id => {
                if ((diceV2Seen[id] || 0) < 2) { rememberDice(id, 2); DICE_V2.cancel({ rollId:id }); }
            });
        }
        nextInQueue();
        return;
    }
    const rank = ФАЗА[v.phase] || 0;
    if (!rank || (diceV2Seen[v.rollId] || 0) >= rank) return;
    /* Первичный снимок базы не переигрывает завершённое. Часы телефона
       не участвуют: результат активного броска принимается с любым временем. */
    if (initial && rank === 2) { rememberDice(v.rollId, rank); return; }
    // Новый бросок ждёт закрытия ручной карточки.
    if (!DICE_V2) return;
    rememberDice(v.rollId, rank);
    const die = v.die === 'd20' ? 20 : 10;
    const options = window.DiceController.optionsFor(diceV2Settings, die);
    if (v.phase === 'rolling') {
        /* Завершённые броски ждут показа. Отменяем только брошенный ввод. */
        [DICE_V2.rollId, ...pendingDiceIds()].filter(Boolean).forEach(id => {
            if (id !== v.rollId && (diceV2Seen[id] || 0) < 2) {
                rememberDice(id, 2); DICE_V2.cancel({ rollId:id });
            }
        });
        DICE_V2.start({ rollId: v.rollId, die, ...options }); nextInQueue(); return;
    }
    if (v.phase === 'cancelled') { DICE_V2.cancel({ rollId: v.rollId }); nextInQueue(); return; }
    /* Firebase может объединить rolling/resolved: такой результат тоже
       ставится в очередь. Уже отменённые rollId отсеяны рангом выше. */
    if (!hasDiceRoll(v.rollId)) DICE_V2.start({ rollId: v.rollId, die, ...options });
    /* СУММА ВМЕСТО ПАРЫ. Раньше при выключенных 3D телефон принимал сумму
       двух D10 одним числом («16») и слал одну грань. Сейчас телефон и
       дашборд всегда требуют два числа (решение автора 28.09.2026), а этот
       разбор оставлен для старой вкладки: пара из одного числа не
       разбиралась — бросок снимался, кубики укатывались, не показав
       выпавшее. Раскладываем сумму поровну: какая пара выпала за столом, из
       суммы не узнать. */
    const грани = Array.isArray(v.faces) ? v.faces.map(Number) : [];
    const ввод = (v.die === '2d10' && грани.length === 1 && грани[0] >= 2 && грани[0] <= 20)
        ? Math.ceil(грани[0] / 2) + ' ' + Math.floor(грани[0] / 2) : грани.join(' ');
    if (!DICE_V2.resolve({ rollId: v.rollId, input: ввод }))
        DICE_V2.cancel({ rollId: v.rollId });
    nextInQueue();
}

function diceV2GiveUp(die, message) {
    if (!DICE_V2) return;
    console.warn('Кубики: ' + (message || 'шкурка не ответила') + ' — ' + diceSkinUrl(die)
               + '. Стример идёт без кубиков (надпись и карточка), пока Ведущий не переключит кубики или шкурку.');
    DICE_V2.dispose(); DICE_V2 = null; diceV2Failed = true; discardPendingSkin();
    nextInQueue();
}
/* Держит ли кубик новой системы очередь показа. */
function diceV2Blocks(ev) {
    if (!DICE_V2 || !ev) return false;
    if (pendingDiceIds().includes(ev.rollId)) return true;
    const card = ['result','dice','sweep'].includes(ev.type);
    /* Its own result appears after one second on the readable face. The
       departing die stays behind it. Unrelated events still wait for space. */
    const ownResult = card && ev.rollId && ev.rollId === DICE_V2.rollId;
    if (DICE_V2.phase !== 'idle' && (!card || !(ownResult ? DICE_V2.resultReady : DICE_V2.centerClear))) return true;
    if (card && ev.rollId && !diceV2Seen[ev.rollId]) {
        /* Две ветки базы могут прийти в обратном порядке. Это лишь предел
           ожидания потерянной команды; длительность анимации им не задаётся. */
        const remaining = DICE_COMMAND_GRACE_MS - (Date.now() - eventReceivedAt.get(ev));

function nextInQueue() {
    clearTimeout(queueRetry); queueRetry = null;

    if (playQueue.length && diceV2Blocks(playQueue[0])) { playing = true; DICE_V2.setBlocked(false); return; }
    const ev = playQueue.shift();
    if (!ev) { playing = false; DICE_V2?.setBlocked(false); return; }
    playing = presenting = true;
    stopDiceSizePreview();
    DICE_V2?.setBlocked(true);
    if (ev.rollId) rememberDice(ev.rollId, 2); /* поздняя команда не переигрывает уже показанное */

}

function resetUndoPresentation() {
    VFX_REVISION++;
    playQueue.length=0;STREAM_VFX?.cancel();clearTimeout(queueRetry);queueRetry=null;
    [DICE_V2?.rollId,...pendingDiceIds()].filter(Boolean).forEach(id=>{rememberDice(id,2);DICE_V2?.cancel({rollId:id});});
    for(const box of [...activeResultCards])box.finish();
    $('fx-layer')?.replaceChildren?.();
    waitingCard=null;presenting=false;playing=false;DICE_V2?.setBlocked(false);
    stopDiceSizePreview();
    // Музыкальный приёмник/текущая позиция остаются в живой странице.
}
function closeResultCard() {
    if (!waitingCard) return;
    waitingCard.finish();
}

const activeResultCards = new Set();
function syncCardMode(box) {
    clearTimeout(box.closeTimer);
    if (S.autoShow) {
        if (waitingCard === box) waitingCard = null;
        if(box.cardStarted!==null)
            box.closeTimer = setTimeout(box.finish, Math.max(0, box.cardDuration - (Date.now() - box.cardStarted)));
    } else waitingCard = box;
}

function finishCardAfter(box, done, ms, deferStart = false) {
    let closed = false;
    box.finish = () => {
        if (closed) return;
        closed = true;
        clearTimeout(box.closeTimer);
        box.cancelImageWait?.();
        if (waitingCard === box) waitingCard = null;
        activeResultCards.delete(box);
        box.remove();
        done();
    };
    box.style.scale=String(Math.max(.6,Math.min(1.5,Number(S.vfx?.resultSize)/100||1)));
    box.cardStarted = deferStart ? null : Date.now(); box.cardDuration = ms;
    activeResultCards.add(box);
    syncCardMode(box);
    return () => {
        if(closed)return false;
        box.cardStarted=Date.now();syncCardMode(box);return true;
    };

/* Decode the actual card before mounting its numbers. A cancelled/old result
   stays cancelled even if its network request finishes after the next battle. */
function prepareResultImage(img, box, done) {
    let settled=false;
    const cleanup=()=>{clearTimeout(timer);img.onload=img.onerror=null;};
    const finish=ok=>{if(settled)return;settled=true;cleanup();done(ok);};
    const timer=setTimeout(()=>finish(false),8000);
    box.cancelImageWait=()=>{settled=true;cleanup();};
    const loaded=()=>{
        if(!img.naturalWidth){finish(false);return;}
        if(img.decode)img.decode().then(()=>finish(true),()=>finish(false));
        else finish(true);
    };
    img.onload=loaded;img.onerror=()=>finish(false);
    if(img.complete)loaded();
}

/* Карточка результата — третий такт. Урон считает ДАШБОРД, стример только
   показывает: он не знает правил и знать не должен (железное правило 7). */
function showResultCard(ev, layer, done) {
    if(resultDismissed(ev.eventId)){done();return;}
    const box = document.createElement('div');
    box.resultEventId=ev.eventId || '';
    box.className = 'dice-result-box' + (num(ev.damage) > 0 ? ' atk' : ' def');
    box.style.position = 'relative';

    const dmg = num(ev.damage);
    const dmgHtml = dmg > 0
        ? `<div class="dice-value" style="color:#e74c3c">−${dmg}</div>`
        : `<div class="dice-value" style="color:#2ecc71">0</div>`;
    const who = ev.targetName ? `${esc(ev.who)} → ${esc(ev.targetName)}` : esc(ev.who);
    const parts = (ev.parts || []).map(p => `<div style="font-size:0.85rem;color:#aaa">${esc(p)}</div>`).join('');
    const plainHTML=()=>`<div class="plain-who">${who}</div><div class="plain-outcome">${esc(ev.outcome||'Итог')}</div>
        ${ev.raw==null?'':`<div class="plain-roll">Бросок <b>${num(ev.raw)}</b>${num(ev.total)!==num(ev.raw)?` → итог <b>${num(ev.total)}</b>`:''}</div>`}
        <div class="plain-damage">${dmg>0?'−'+dmg+' HP':'Урон: 0 HP'}</div>

    /* Картинка исхода приходит готовой от дашборда — он знает, кто бил.
       Нет картинки (класс без набора) — карточка просто без неё. */
    /* Числа ПОВЕРХ карточки, без фоновой панели: рамка и цифры, как в
       шаблоне автора. Блок рисуется только если дашборд прислал raw —
       старые записи и старый дашборд его не шлют, и карточка тогда просто
       остаётся картинкой. */
    const numbers = (ev.raw == null) ? '' : `
        <div class="card-nums">
            <div class="cn-label">ВЫКИНУЛ</div>
            <div class="cn-raw">${num(ev.raw)}</div>
            ${num(ev.total) !== num(ev.raw) ? `
              <div class="cn-line"></div>
              <div class="cn-label">ИТОГ С БОНУСОМ</div>
              <div class="cn-total">${num(ev.total)}</div>` : ''}
            ${(ev.tags || []).length ? `<div class="cn-tags">${
                /* МЕТКА ДВУХЦВЕТНАЯ: слово оранжевое, число красное — те же
                   два цвета, что у больших чисел. Режем по последнему
                   пробелу: «Атака +2» -> «Атака» и «+2». Пробела нет —
                   красим целиком, как было. */
                ev.tags.map(t => {
                    const txt = String(t.text || '');
                    const i = txt.lastIndexOf(' ');
                    const тело = i > 0
                        ? `<b>${esc(txt.slice(0, i))}</b><i>${esc(txt.slice(i + 1))}</i>`
                        : esc(txt);
                    return `<span class="cn-tag ${esc(t.kind || '')}">${тело}</span>`;
                }).join('')
            }</div>` : ''}
        </div>`;

    /* ОДНА КАРТОЧКА, А НЕ ДВЕ. Картинка исхода вкладывалась внутрь старой
       серой рамки 300×400, а под ней ещё рисовались «ИТОГ», кто, большое
       число и исход. Серый блок физически торчал из-под новой карточки — это
       и было «после броска выносится что попало».

       Есть картинка — обёртка прозрачная; кто, исход и урон — отдельной
       плашкой под карточкой. Нет картинки (класс без набора) —
       остаётся прежний вид, иначе зритель увидел бы пустоту. */
    if (ev.kind === 'ability') {
        box.className = 'loot-popup';
        box.innerHTML = `<div class="dice-who">${who}</div>
            <div class="dice-outcome">${esc(ev.outcome || 'Умение')}</div>
            ${ev.value == null ? '' : `<div class="dice-value">${num(ev.value)}</div>`}${numbers}`;
    } else if (ev.card) {
        box.className = 'combat-result-card';
        box.innerHTML = `<div class="outcome-wrap">
            <img src="${esc(ev.card)}" class="outcome-card" alt="">${numbers}</div>
            <div class="combat-result-caption"><div>${esc(ev.who)}${ev.targetName
                ? ` → <span class="result-target">${esc(ev.targetName)}</span>` : ''}</div>
            <div>${esc(ev.outcome || '')}${dmg > 0 ? ` · <span class="result-damage">−${dmg} HP</span>` : ''}</div></div>`;
    } else {
        box.className='plain-combat-result';
        box.innerHTML=plainHTML();
    }
    // Reading time starts with the visible card, not with its download.
    // Register first so manual dismissal/undo can also close a loading card.
    const start=finishCardAfter(box,done,S.autoShow&&ev.brief?CARD_BRIEF_MS:CARD_FULL_MS,true);
    const reveal=()=>{if(start())layer.appendChild(box);};
    const img=box.querySelector('.outcome-card');
    if(img)prepareResultImage(img,box,ok=>{

function playEvent(ev, done) {
    ev=ev?{...ev,presentationRevision:VFX_REVISION}:ev;
    /* Новая карточка могла принести видео — глушим сразу, если выключено. */
    if (MUTED) document.querySelectorAll('audio,video').forEach(m => { m.muted = true; });
    /* Событие могло принести звук умения — джингл барда. Играем его здесь,
       вместе с объявлением броска: он сопровождает показ, а не идёт отдельно. */
    if (ev && ev.sound !== undefined) playJingle(ev.sound, ev.soundAlt);
    const layer = $('fx-layer');
    done = done || function () {};
    if (!ev || !layer) { done(); return; }

    if (ev.type === 'vfx') {playResolvedVfx(ev,done);return;}
    if (ev.type === 'result') { showResultCard(ev, layer, ()=>playResolvedVfx(ev,done)); return; }
    if (ev.type === 'sweep')  { showSweepCard(ev, layer, ()=>playResolvedVfx(ev,done)); return; }

    if (ev.type === 'dice') {
        /* ПОСЛЕ КУБИКА — НИЧЕГО. Здесь всплывала плашка с числом и словом
           «ПОПАДАНИЕ»: отдельная система показа, придуманная до карточек.
           Она говорила то же самое, только беднее и другим шрифтом, и
           вылезала ПЕРЕД карточкой — зритель видел один бросок дважды в
           двух оформлениях, и две системы уже начали расходиться.

           Кубик остался: он сопровождает бросок за столом и никого не
           дублирует. Числа, поправки и исход показывает карточка — там для
           них есть место и разбор. */
        /* КУБИК ПОКАЗЫВАЕТ ОДНА СИСТЕМА — по battle/diceRoll, до этой
           карточки (решение автора 28.09.2026). Старое вращение плоского
           кубика и иконка убраны: здесь только песня и карточка. */
        if (ev.subtype === 'skill' && !ev.song)
            showResultCard({ ...ev, kind:'ability', value:ev.val }, layer, done);
        else songCard(ev, layer, done);
        return;
    }
    if (ev.type === 'relic') {
        const box = document.createElement('div');
        box.className = 'loot-popup';
        box.innerHTML = `<div style="color:#ffd700; font-weight:bold; font-size:1.5rem; margin-bottom:10px;">РЕЛИКВИЯ</div>
            <div style="font-size:2rem; font-weight:bold;">${esc(ev.outcome || '')}</div>
            <div style="color:#aaa;">${esc(ev.who || '')}</div>`;
        layer.appendChild(box);
        setTimeout(() => { box.remove(); done(); }, 5000);
        return;
    }
    if (ev.type === 'loot') {
        const box = document.createElement('div');
        box.className = 'loot-popup';
        box.innerHTML = `<div style="color:#ffd700; font-weight:bold; font-size:1.5rem; margin-bottom:10px;">ПОЛУЧЕН ЛУТ</div>
            <img src="${iconUrl(ev.icon)}" style="width:120px; height:120px; object-fit:contain; margin-bottom:10px;">
            <div style="font-size:2rem; font-weight:bold;">${esc(ev.itemName)}</div>
            <div style="color:#aaa;">Владелец: ${esc(ev.ownerName)}</div>`;
        layer.appendChild(box);
        setTimeout(() => { box.remove(); done(); }, 5000);
        return;
    }
    /* Наёмник: пришёл, пал или ушёл. Вырезанная картинка и реплика. */
    if (ev.type === 'companion') {
        const box = document.createElement('div');
        box.className = 'companion-box' + (ev.kind === 'down' ? ' is-down' : '');
        box.innerHTML =
            (ev.img ? `<img src="${esc(assetUrl(ev.img))}" class="companion-art">` : '') +
            `<div class="companion-name">${esc(ev.name || '')}</div>` +
            `<div class="companion-line">${esc(ev.line || '')}</div>`;
        layer.appendChild(box);
        setTimeout(() => { box.remove(); done(); }, 4000);
        return;
    }

    /* СПОСОБНОСТЬ ВРАГА: клич главаря, вой альфы, зелье. Дашборд слал их
       всегда (data-contract), а стрим молча пропускал как неизвестный тип —
       зритель клича и воя не видел (найдено 30.09.2026 с зельем врага). */
    if (ev.type === 'enemy_skill') {
        const box = document.createElement('div');
        box.className = 'loot-popup enemy-skill-card';
        box.innerHTML = `<div style="color:#e74c3c; font-weight:bold; font-size:1.5rem; margin-bottom:10px;">${esc(ev.name || '')}</div>
            ${ev.icon ? `<img src="${esc(assetUrl(ev.icon))}" style="width:96px; height:96px; object-fit:contain; margin-bottom:10px;">` : ''}
            <div style="font-size:1.8rem; font-weight:bold;">${esc(ev.line || '')}</div>
            <div style="color:#aaa;">${esc(ev.who || '')}</div>`;
        layer.appendChild(box);
        setTimeout(() => { box.remove(); playResolvedVfx(ev,done); }, 3000);
        return;
    }

    if (ev.type === 'victory') { showVictory(ev); done(); return; }
    if (ev.type === 'clear_victory') { $('victory-screen').style.display = 'none'; }
    /* Неизвестный тип очередь не держит — иначе один чужой ключ повесит экран. */
    done();
}

/* Карточка РАЗМАШИСТОГО УДАРА. Один замах, но защиту каждый кидал свою —
   поэтому одна карточка со списком, а не четыре отдельные.
   Строки приходят готовыми из движка (resolveSweep): здесь только вёрстка. */
function showSweepCard(ev, layer, done) {
    done = done || function () {};
    const rows = Array.isArray(ev.rows) ? ev.rows : [];
    if(resultDismissed(ev.eventId)){done();return;}
    const box = document.createElement('div');
    box.resultEventId=ev.eventId || '';
    box.className = 'dice-result-box atk';
    box.style.position = 'relative';
    box.style.minWidth = '340px';

    const line = r => {
        const dead = r.dead ? ' † ПАЛ' : '';
        const col = r.outcome === 'parry' ? '#5dade2'
                  : r.outcome === 'block' ? '#7fb3a3'
                  : r.dead ? '#e67e22' : '#ddd';
        return `<div style="display:flex;justify-content:space-between;gap:14px;
                     padding:4px 0;border-bottom:1px solid rgba(255,255,255,.08);color:${col}">
            <span>${esc(r.name || '')}</span>
            <span style="opacity:.75">${esc(r.label || '')}</span>
            <span style="font-weight:bold">−${num(r.damage)}${dead}</span></div>`;
    };

    const s = ev.summary || {};
    const roll = ev.raw == null ? '' : `<div class="dice-outcome">Выкинул: ${num(ev.raw)} · Итог: ${num(ev.total)}<br>${
        (ev.tags || []).map(t => esc(t.text || '')).join(' · ')}</div>`;
    box.innerHTML = `<div class="dice-label">РАЗМАШИСТЫЙ УДАР</div>
        <div class="dice-who">${esc(ev.who || '')}</div>${roll}
        <div style="margin:10px 0;font-size:.95rem">${rows.map(line).join('')}</div>
        <div class="dice-outcome">целей ${num(s.targets)} · урона ${num(s.total)}${
            num(s.killed) ? ' · повержено ' + num(s.killed) : ''}</div>`;
    layer.appendChild(box);
    /* Как и остальные итоги: три секунды или подтверждение мастера. */
    finishCardAfter(box, done, CARD_FULL_MS);
}

function showVictory(data) {
    const screen = $('victory-screen');
    const grid = $('victory-loot-grid');
    grid.innerHTML = '';
    screen.style.display = 'flex';
    $('victory-xp-val').innerHTML = `+${num(data.xp)} XP`;

    (Array.isArray(data.lootData) ? data.lootData : []).forEach(item => {
        const box = document.createElement('div');
        box.className = 'loot-item-container';
        box.innerHTML = `<img src="${iconUrl(item.icon)}" class="loot-icon-img">` +
            (item.label ? `<div class="loot-item-label">${esc(item.label)}</div>` : '');
        grid.appendChild(box);
    });
}

/* ==========================================================================
   8. ВХОД
   ========================================================================== */

window.connectStream = function () {
    const room = $('room-id').value.trim().toUpperCase();
    const pass = $('room-pass').value.trim();
    if (!room) return;
    get(ref(db, `rooms/${room}/config`)).then(snap => {
        if (!snap.exists()) {
            alert('Комната не найдена. Ведущий ещё не запустил дашборд.');
            return;
        }
        const cfg = snap.val() || {};
        if (cfg.password && cfg.password !== pass) {
            alert('Неверный пароль.');
            return;
        }
        S.room = room;
        lsSet(LS_ROOM, room);
        boot();
    }).catch(e => alert('Не удалось подключиться: ' + e.message));
};

window.exitStreamRoom = function () {
    if(parent!==window){parent.postMessage({type:'gb-close-stream',room:S.room},'*');return;}
    localStorage.removeItem(LS_ROOM);
    location.reload();
};

function boot() {
    $('login-screen').style.display = 'none';
    $('streamRoomName').innerText = S.room;
    S.ready = true;
    try { const saved = localStorage.getItem(localStreamResKey()); localStreamRes = validStreamRes(saved) ? saved : null; }
    catch { localStreamRes = null; }
    applyPersonalScreen();
    if(window.parent!==window)window.parent.postMessage({type:"gb-screen-ready",room:S.room},"*");
    subscribe();
    render();
}

(function start() {
    /* Комнату можно передать ссылкой: streamer.html?room=GAME1 —
       так её открывает полноэкранный режим в телефоне игрока. */
    const fromUrl = new URLSearchParams(location.search).get('room');
    const saved = fromUrl || localStorage.getItem(LS_ROOM);
    let resume = false;
    try {
        const key = 'gb_stream_resume_'+String(saved || '').toUpperCase();
        resume = sessionStorage.getItem(key) === '1'; sessionStorage.removeItem(key);
    } catch {}
    if (SINK && typeof makeStreamMusic === 'function') STREAM_MUSIC = makeStreamMusic({ sink: SINK, resume });
    if (saved) {
        $('room-id').value = saved;
        S.room = saved.toUpperCase();
        boot();
    }
})();

/* Loaded in the streamer module scope; no state writes. */
var STREAM_VFX=null,VFX_REVISION=0;
function streamVfxCards(){
 const D=derive();return [...D.players.map(d=>({id:'player:'+d.id,type:'player',name:d.p.name,cls:d.cls,role:d.role,record:d.p,
  hp:num(d.p.hp),maxHP:d.maxHP,el:$('target-player-'+d.id),art:heroArt({cls:d.cls,gender:d.p.gender,race:d.p.race,isRogue:d.isRogue,variant:d.p.portrait,where:num(d.drunk)>=3?'drunk':'streamer'})})),
 ...D.enemies.map(d=>({id:'enemy:'+d.id,type:'enemy',name:d.e.name,cls:d.e.isRanged?'archer':'warrior',role:d.role,record:d.e,animal:d.e.human===false,
  hp:num(d.e.currentHP),maxHP:num(d.e.maxHP),el:$('target-enemy-'+d.id),art:iconUrl(d.e.img)}))];
}
function streamVfx(){
 if(!STREAM_VFX&&window.GrivensburgVFX&&typeof window.CanvasRenderingContext2D==='function'){
  STREAM_VFX=window.GrivensburgVFX.create({host:$('fit-root'),assetUrl,items:()=>S.items,cards:streamVfxCards,
   settings:()=>S.vfx||{},world:()=>({players:S.players,enemies:S.enemies,round:S.round,battleNo:S.battleNo,queue:S.queue}),muted:()=>MUTED,volume:()=>screenPrefs().volume/100});
 }
 return STREAM_VFX;
}
function playResolvedVfx(ev,done){ if(ev.restored){done();return}
 if(!ev.presentation||ev.presentationRevision!==VFX_REVISION){done();return}
 const fx=streamVfx();if(!fx){done();return}
 if(SINK)SINK.duck(12000);
 fx.play(ev.presentation).catch(error=>console.warn('VFX',error)).finally(()=>{if(SINK)SINK.unduck();done();});
}
