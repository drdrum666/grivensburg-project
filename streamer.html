<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Client v92.1 (Loot Layer Fix)</title>
    <style>
        :root { --bg-dark: #1a1a1d; --bg-panel: #2c2c2e; --accent: #f39c12; --bright-gold: #ffd700; --danger: #c0392b; --mana: #2980b9; --text: #ecf0f1; --bonus-green: #2ecc71; --xp-purple: #9b59b6; }
        
        /* ═══════════════════════════════════════════════════════════════
           РАСКЛАДКА ПОД ЛЮБОЙ ЭКРАН.

           Оформление собрано под ширину 1920: в нём 383 жёстких размера в
           точках. На телевизоре 4К окно вдвое шире, карточки расходились и
           налезали друг на друга.

           Переписывать 383 числа бессмысленно — вместо этого весь экран
           масштабируется целиком, как картинка. Раскладка остаётся ровно
           той, под которую нарисована, и одинаково выглядит и на ноутбуке,
           и на 4К.

           Считается в js (см. fitScreen), потому что нужно и по ширине, и по
           высоте: на широком, но низком окне упереться должно в высоту.
           ═══════════════════════════════════════════════════════════════ */
        :root { --fit: 1; }
        #fit-root {
            width: 1920px; height: 1080px;
            transform: scale(var(--fit));
            transform-origin: top left;
            position: absolute; top: 0; left: 0;
        }
        html, body { margin:0; padding:0; width: 100vw; height: 100vh; overflow:hidden; font-family:'Segoe UI',Tahoma,sans-serif; background-color:var(--bg-dark); color:var(--text); overflow: hidden; }

        /* ВХОД */
        #login-screen { 
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:5000; 
            display:flex; flex-direction:column; justify-content:center; align-items:center; gap: 10px; 
            background: url('https://raw.githubusercontent.com/drdrum666/grivensburg-project/main/assets/chapters/chapter_1/scene_12_battle_sewerage_16_9.jpg') no-repeat center center;
            background-size: cover;
        }
        .login-input { padding: 15px; font-size: 1.5rem; text-align: center; background: #222; border: 2px solid var(--accent); color: white; border-radius: 10px; width: 300px; }
        .btn-connect { padding: 15px 40px; font-size: 1.5rem; background: var(--accent); border: none; font-weight: bold; cursor: pointer; border-radius: 10px; color: black; margin-top: 10px; transition: 0.2s; }
        .btn-connect:hover { background: #fff; box-shadow: 0 0 20px var(--accent); }

        /* СЦЕНА */
        #main-stage {
            width: 100%; height: 100%;
            background-image: url('https://raw.githubusercontent.com/drdrum666/grivensburg-project/main/assets/chapters/chapter_1/scene_12_battle_sewerage_16_9.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            position: relative; transition: background-image 0.5s; display: flex; flex-direction: column; justify-content: space-between;
        }
        
        #bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 0; display: none;
        }

        #main-stage::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); pointer-events: none; z-index: 1; }

        /* ИНТЕРФЕЙС */
        .stream-header { height: 70px; background: #111; border-bottom: 4px solid var(--accent); display: flex; align-items: center; padding: 0 30px; z-index: 50; box-shadow: 0 5px 20px rgba(0,0,0,0.8); flex-shrink: 0; position: relative; }
        .header-title-container { width: 100%; display: flex; justify-content: center; }
        .header-title { color: var(--accent); font-family: 'Georgia', serif; text-transform: uppercase; letter-spacing: 3px; font-size: 2rem; margin: 0; text-shadow: 0 2px 10px rgba(243, 156, 18, 0.4); display: flex; align-items: baseline; gap: 15px; }
        .scenario-tag { font-size: 1.4rem; color: #ccc; font-weight: normal; letter-spacing: 1px; font-family: 'Segoe UI', sans-serif; text-transform: none; }

        .round-display { 
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%); 
            background: #111; border: 3px solid var(--bright-gold); border-radius: 30px; 
            padding: 5px 40px; color: white; font-weight: 900; font-size: 1.8rem; 
            display: flex; gap: 15px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); z-index: 60; align-items: center; 
        }

        /* Разделитель между раундом и днём: два числа рядом без него
           читаются как одно длинное. */
        .round-sep { width: 2px; align-self: stretch; margin: 4px 0;
                     background: rgba(255,215,0,.35); border-radius: 2px; }

        /* СЛОИ */
        #game-area { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 40px; position: relative; z-index: 10; }
        
        #party-layer { display: flex; justify-content: flex-start; gap: 25px; padding-top: 60px; overflow-x: visible; transition: opacity 0.5s; opacity: 1; }
        #party-layer.hidden { opacity: 0; pointer-events: none; }
        
        .player-wrapper { margin-right: 5px; position: relative; display: flex; flex-direction: column; align-items: center; }

        /* КАРТОЧКА ИГРОКА */
        .card { min-width: 270px; width: 270px; height: 380px; background: #111; border: 1px solid var(--bright-gold); border-radius: 8px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.9); transition: transform 0.3s; margin-right: 15px; }
        .card.dead { filter: grayscale(100%); opacity: 0.6; border-color: #555; }
        /* Шкала опьянения: столбик с насечками справа в рамке героя, над
           полоской уровня. Заготовка под текстуру бутылки. */
        .booze-col { position: absolute; right: 8px; top: 42%; z-index: 6;
            width: 16px; height: 84px; background: rgba(0,0,0,0.55);
            border: 2px solid #e08a2b; border-radius: 3px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6); }
        .booze-col-fill { position: absolute; left: 0; right: 0; bottom: 0;
            background: linear-gradient(#e8b45c, #a9741f); transition: height .3s; }
        .booze-col-tick { position: absolute; left: 0; right: 0; height: 2px;
            background: rgba(255,255,255,0.35); }
        .booze-col.is-hangover { border-color: #6aa84f; }

        .card-header { height: 100%; background-size: cover; background-position: top center; position: absolute; top: 0; left: 0; width: 100%; z-index: 0; }
        /* ПОРТРЕТ ВО ВСЮ КАРТОЧКУ.

           ЧЁРНАЯ ПОЛОСА В РАМКЕ ГЕРОЯ жила здесь. Правило укорачивало
           портрет на 52 пикселя — ровно наоборот тому, что написано в этой
           же строке комментария, и вопреки имени класса `tall`.

           Откуда 52: столько занимало ПРЕЖНЕЕ тело карточки со статами,
           сумкой и полосой опыта. Потом тело ужали до `slim` — остались
           жизнь и ресурс, — а число осталось прежним. Тело ниже 52 пикселей,
           и между низом портрета и его верхом открывалась голая подложка
           карточки (`background:#111`) — чёрная полоса поперёк рамки.

           Подпирать новым числом нельзя: тело растёт от содержимого, и любая
           подобранная цифра снова разойдётся. Портрет идёт во всю высоту, а
           тело лежит поверх него — у него своя заливка, которая кверху
           сходит на нет, так что лицо она не режет. */
        .card-header.tall{height:100%;}
        .card-body.slim{padding:4px;}
        .card-body.slim .vitals-row{display:flex;gap:5px;justify-content:center;}
        .card-body { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px 8px 5px 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 3px; z-index: 5; background: linear-gradient(to top, rgba(10,10,10,.7) 85%, rgba(10,10,10,0) 100%); border-top: none; }

        .h-text-block { display: flex; flex-direction: column; gap: 1px; margin-bottom: 3px; text-shadow: 2px 2px 5px black; }
        .h-main-row { display: flex; align-items: baseline; gap: 8px; }
        .h-name { font-size: 1.4rem; font-weight: 900; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }
        .h-lvl { font-size: 1.2rem; font-weight: 900; color: var(--bright-gold); text-shadow: 0 0 5px black; }
        .h-sub-row { font-size: 0.85rem; color: #ccc; font-style: italic; font-weight: bold; text-transform: uppercase; }
        
        .xp-bar-dashboard { width: 100%; height: 3px; background: #333; margin-bottom: 3px; position: relative; }
        .xp-bar-dash-fill { height: 100%; background: var(--xp-purple); width: 0%; transition: width 0.5s; box-shadow: 0 0 5px var(--xp-purple); }

        .db-spell-slot { position: absolute; top: 10px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid #333; background: rgba(0,0,0,0.5); overflow: hidden; z-index: 20; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
        .db-spell-slot.left { left: 10px; } .db-spell-slot.right { right: 10px; }
        .db-spell-slot img { width: 100%; height: 100%; object-fit: cover; }

        .vitals-row { display:flex; gap:5px; margin-bottom: 2px; }
        .control-group { flex:1; display:flex; align-items:center; background:rgba(34,34,34,.7); padding:2px; border-radius:3px; border:1px solid #333; height:22px; justify-content: center; }
        .val-display { font-weight:bold; font-size:0.9rem; color: white; }
        .gold-text { color:#f1c40f; } .hp-text { color:var(--danger); } .mp-text { color:var(--mana); }
        
        .db-stats-container { display: flex; gap: 5px; flex: 1; }
        .db-stat-col { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .db-stat-box { background: #1a1a1d; border: 1px solid #444; padding: 3px 5px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; border-radius: 3px; color: #ccc; }
        .db-stat-val { font-weight: bold; color: white; }

        /* ОЧЕРЕДЬ */
        #queue-layer { display: flex; justify-content: flex-start; opacity: 1; transition: opacity 0.5s; align-items: center; height: 130px; }
        #queue-layer.hidden { opacity: 0; pointer-events: none; }
        .queue-strip { display: flex; gap: 7px; padding: 0; background: transparent; transform: scale(1.3); transform-origin: center left; }
        .queue-card { width: 104px; height: 143px; border-radius: 6px; overflow: hidden; border: 2px solid #555; position: relative; background: #111; box-shadow: 0 5px 15px rgba(0,0,0,0.6); }
        .queue-card.player { border-color: var(--bonus-green); } .queue-card.enemy { border-color: var(--danger); }
        .queue-card:first-child { border-color: var(--bright-gold); box-shadow: 0 0 20px rgba(255, 215, 0, 0.8); transform: scale(1.15); margin-right: 15px; z-index: 20; }
        .queue-card img { width: 100%; height: 100%; object-fit: cover; }
        .queue-name { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); color: white; font-size: 0.75rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 3px 0; }
        .queue-init-badge { position: absolute; top: 0; right: 0; background: #f39c12; color: black; font-size: 0.85rem; font-weight: bold; padding: 0 3px; border-radius: 0 0 0 5px; z-index: 10; border-left: 1px solid #333; border-bottom: 1px solid #333; min-width: auto; text-align: center; }
        /* Номер ВРАГА в очереди. Раньше разметка читала item.number, а
           дашборд такого поля в очередь не пишет — номер не появлялся
           никогда. Зрителям без него не понять, какой из четырёх
           одинаковых волков ходит. */
        .queue-num-badge{position:absolute;top:4px;left:4px;z-index:6;min-width:22px;height:22px;
            border-radius:50%;background:rgba(160,20,20,.95);border:2px solid #f0c0c0;
            color:#fff;font-weight:800;font-size:.85rem;line-height:19px;text-align:center;}
        .queue-num { position: absolute; top: 0; left: 0; background: var(--danger); color: white; font-size: 0.8rem; font-weight: bold; padding: 1px 5px; z-index: 5; border-bottom: 1px solid #333; border-right: 1px solid #333; border-radius: 0 0 5px 0; }
        .q-hp-wrap { position: absolute; bottom: 20px; left: 0; width: 100%; height: 6px; background: #333; }
        .q-hp-fill { height: 100%; transition: width 0.3s; }

        /* ВРАГИ */
        #enemies-layer { display: flex; gap: 15px; justify-content: flex-start; align-items: flex-end; opacity: 1; transition: opacity 0.5s; padding-bottom: 10px; overflow-x: visible; }
        #enemies-layer.hidden { opacity: 0; pointer-events: none; }
        .enemy-card { min-width: 270px; width: 270px; height: 380px; background: #000; border: 2px solid #500; border-radius: 8px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 10px 20px rgba(0,0,0,0.8); transition: all 0.3s ease; }
        .enemy-card.active-turn { border-color: var(--bright-gold) !important; box-shadow: 0 0 20px rgba(255, 215, 0, 0.8) !important; transform: translateY(-5px); z-index: 20; }
        .enemy-card.dead { filter: grayscale(100%); opacity: 0.5; border-color:#333 !important; box-shadow: none !important; transform: none !important; }
        .enemy-card.dead::after { content: 'ТРУП'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); color: #c0392b; font-size: 4rem; font-weight: 900; border: 5px solid #c0392b; padding: 5px 15px; z-index: 50; }
        .enemy-card[data-animal=true].dead { filter:none; opacity:.7; }
        .enemy-card[data-animal=true].dead>.enemy-bg-img { filter:grayscale(1) brightness(.75); }
        .enemy-card[data-animal=true].dead::after { top:62%; transform:translate(-50%,-100%); color:#521c22; font:bold 50px Georgia,serif; border:0; padding:0; text-shadow:0 1px 1px #170308; }
        .enemy-bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .enemy-overlay { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.665) 40%, rgba(0,0,0,0.42) 90%, transparent 100%); padding: 5px; box-sizing: border-box; z-index: 10; border-top: 1px solid #444; }
        /* Имя в ОДНУ строку и постоянной высоты: иначе длинное имя
           переносилось на вторую строку, толкало панель вверх и закрывало
           половину морды врага. Кегль подбирает nameSize() по длине. */
        .enemy-name { font-weight: bold; color: #e74c3c; font-size: 1.5rem; text-shadow: 2px 2px 4px black;
                      text-transform: uppercase; line-height: 1.7rem; height: 1.7rem; margin-bottom: 3px;
                      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Классы, которые код рисовал без стилей. */
        .buff-debuff-row { min-height: 16px; }
        .db-stat-label { color: #999; }
        .h-sub { color: #aaa; font-size: .8rem; }
        .inv-item { display: flex; align-items: center; gap: 4px; font-size: .7rem; color: #ccc; }
        .inv-item img { width: 16px; height: 16px; object-fit: contain; }
        .hp-bar-cont { width: 100%; height: 30px; background: #111; border: 1px solid #555; border-radius: 4px; overflow: hidden; position: relative; margin-bottom: 8px; }
        .hp-fill { height: 100%; background: #c0392b; transition: width 0.3s; }
        .hp-txt { position: absolute; width: 100%; text-align: center; font-size: 1.1rem; line-height: 30px; color: white; text-shadow: 1px 1px 2px black; font-weight: bold; top:0; }
        
        .stat-row { display: flex; gap: 3px; width: 100%; margin-top: auto; }
        .stat-badge { flex: 1; height: 28px; background: rgba(0,0,0,0.56); border-radius: 4px; border: 1px solid #555; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; box-sizing: border-box; text-shadow: 1px 1px 2px black; }
        .enemy-num { position: absolute; top: 10px; left: 10px; background: var(--danger); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.4rem; border: 2px solid white; z-index: 20; box-shadow: 0 2px 5px black; }
        .aggro-display { color: #f39c12; font-size: 1rem; font-weight: bold; margin-bottom: 5px; text-shadow: 1px 1px 2px black; }

        /* ЖУРНАЛ */
        #combatLog { position: absolute; top: 50%; right: 20px; transform: translateY(-50%); width: 350px; height: 400px; background: rgba(0,0,0,0.85); border: 2px solid #555; border-radius: 8px; display: flex; flex-direction: column; z-index: 50; opacity: 1; transition: opacity 0.5s; backdrop-filter: blur(5px); pointer-events: none; }
        #combatLog.hidden { opacity: 0; }
        .log-header { padding: 8px 12px; background: #333; color: var(--accent); font-size: 0.9rem; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #444; flex-shrink: 0; }
        /* ЖУРНАЛ НЕ СКРОЛЛИЛСЯ. На рамке стоит `pointer-events:none`, чтобы
           панель не перехватывала нажатия по тому, что под ней. Заодно она
           отрезала и колесо мыши: до содержимого оно не доходило вовсе, и
           прокрутить журнал было нельзя, хотя полоса прокрутки рисовалась.
           Возвращаем события ТОЛЬКО тексту — рамка и заголовок остаются
           прозрачными для нажатий. */
        .log-content { flex: 1; overflow-y: auto; padding: 10px; gap: 4px; display: flex; flex-direction: column; pointer-events: auto; }
        .log-content::-webkit-scrollbar { width: 6px; } .log-content::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        .log-entry { padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; color: #ccc; display: block; }
        .log-entry::before { content: '> '; opacity: .55; }
        /* Раньше вся строка красилась в один цвет — теперь цвет несут отдельные
           слова внутри строки (см. .log-name/.log-kw-*), строка сама нейтральная. */
        .log-info { color: #9a958a; }
        .log-hit { color: #ccc; }
        .log-dmg { color: #ccc; }
        .log-kill { color: #f5c451; font-weight: 600; }
        .log-name    { color: var(--bright-gold); font-weight: 700; }
        .log-kw-atk  { color: var(--danger); font-weight: 700; }
        .log-kw-heal { color: var(--bonus-green); font-weight: 700; }
        .log-kw-mana { color: var(--mana); font-weight: 700; }
        .log-kw-kill { color: #f5c451; font-weight: 900; }

        /* ФИКС: анимации тряски/свечения карточек — вызывались в JS
           (triggerVisualFX добавляет anim-shake-red/anim-pulse-green/anim-pulse-blue),
           но не было ни одного @keyframes. Дизайн/цвета не меняю. */
        @keyframes cardShakeRed {
            0%   { transform: translate(0,0) rotate(0deg);        box-shadow: 0 0 0 0 rgba(220,60,55,0), 0 10px 28px rgba(0,0,0,.8); }
            12%  { transform: translate(-5px,2px) rotate(-1.4deg); box-shadow: 0 0 26px 5px rgba(220,60,55,.8), 0 10px 28px rgba(0,0,0,.8); }
            26%  { transform: translate(5px,-2px) rotate(1.4deg); }
            40%  { transform: translate(-4px,2px) rotate(-1deg); }
            54%  { transform: translate(3px,-1px) rotate(0.8deg); }
            68%  { transform: translate(-2px,1px) rotate(-0.5deg); box-shadow: 0 0 14px 2px rgba(220,60,55,.4), 0 10px 28px rgba(0,0,0,.8); }
            84%  { transform: translate(1px,0) rotate(0.2deg); }
            100% { transform: translate(0,0) rotate(0deg);        box-shadow: 0 0 0 0 rgba(220,60,55,0), 0 10px 28px rgba(0,0,0,.8); }
        }
        @keyframes cardPulseGreen {
            0%   { box-shadow: 0 0 0 0 rgba(110,210,120,0), 0 10px 28px rgba(0,0,0,.8); }
            30%  { box-shadow: 0 0 30px 6px rgba(110,210,120,.75), 0 10px 28px rgba(0,0,0,.8); }
            100% { box-shadow: 0 0 0 0 rgba(110,210,120,0), 0 10px 28px rgba(0,0,0,.8); }
        }
        @keyframes cardPulseBlue {
            0%   { box-shadow: 0 0 0 0 rgba(90,165,230,0), 0 10px 28px rgba(0,0,0,.8); }
            30%  { box-shadow: 0 0 28px 5px rgba(90,165,230,.75), 0 10px 28px rgba(0,0,0,.8); }
            100% { box-shadow: 0 0 0 0 rgba(90,165,230,0), 0 10px 28px rgba(0,0,0,.8); }
        }
        .anim-shake-red   { animation: cardShakeRed 0.42s ease-in-out; }
        .anim-pulse-green { animation: cardPulseGreen 0.9s ease-out; }
        .anim-pulse-blue  { animation: cardPulseBlue 0.9s ease-out; }

        /* ФИКС: авто-вход в комнату из localStorage происходил молча — без
           названия комнаты на экране и без способа выйти/сменить. */
        .stream-room-badge {
            position: absolute; top: 15px; right: 20px; z-index: 70;
            background: #111; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem;
            color: #aaa; border: 1px solid #555; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .stream-room-badge:hover { border-color: var(--danger); color: var(--danger); background: rgba(192,57,43,0.1); }
        .header-version { margin-left: calc(68px / var(--fit)); }
        #stream-resolution { position: fixed; top: 12px; left: 12px; z-index: 8000; font-size: 14px; }
        #stream-resolution[hidden] { display: none; }
        #stream-resolution summary { list-style: none; min-width: 42px; padding: 8px 10px; cursor: pointer;
            text-align: center; font-weight: 700; color: var(--accent); background: #161413;
            border: 1px solid #9c712f; border-radius: 6px; box-shadow: 0 2px 8px #0008; }
        #stream-resolution summary::-webkit-details-marker { display: none; }
        .stream-res-menu { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; padding: 8px;

        .stream-res-menu button { min-height: 38px; padding: 6px 10px; font: inherit; text-align: left; cursor: pointer;
            color: #e9d9c1; border: 1px solid transparent; border-radius: 4px; background: transparent; }
        .stream-res-menu button[aria-pressed="true"] { border-color: #9c712f; background: #38291a; color: #ffc36b; }
        #stream-resolution summary:hover, .stream-res-menu button:hover { background: #38291a; }
        #stream-resolution summary:focus-visible, .stream-res-menu button:focus-visible { outline: 2px solid #ffc36b; outline-offset: 2px; }
        #stream-res-master { margin-top: 3px; border-top-color: #55412b; font-size: 12px; }

        /* FX */
        #fx-layer { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; 
            /* 🔥 ФИКС: Подняли слой до 7000, чтобы лут был ПОВЕРХ сундука (у сундука 6000) */
            z-index: 7000; 
            display: flex; justify-content: center; align-items: center; 
        }
        
        .card-float-dmg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; font-weight: 900; color: white; -webkit-text-stroke: 4px black; text-shadow: 0 0 30px red; z-index: 100; animation: cardFloatUp 1.5s forwards; }
        .card-float-heal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; font-weight: 900; color: #2ecc71; -webkit-text-stroke: 4px black; text-shadow: 0 0 30px #2ecc71; z-index: 100; animation: cardFloatUp 1.5s forwards; }
        .card-float-mana { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; font-weight: 900; color: #2980b9; -webkit-text-stroke: 4px black; text-shadow: 0 0 30px #2980b9; z-index: 100; animation: cardFloatUp 1.5s forwards; }
        @keyframes cardFloatUp { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 20% { transform: translate(-50%, -100%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -200%) scale(1); opacity: 0; } }
        
        /* DICE */
        /* Картинка исхода на карточке итога. Пачками по несколько на исход,
           выбирается случайная — чтобы шутка не приедалась за вечер. */
        /* Наёмник на экране зрителей: вырезанная фигура и его реплика. */
        .companion-box { position:absolute; left:50%; bottom:8%; transform:translateX(-50%);
            display:flex; flex-direction:column; align-items:center; z-index:40;
            animation: compIn .5s ease-out; }
        .companion-art { height:44vh; max-height:520px; filter: drop-shadow(0 0 34px rgba(255,190,90,.55)); }
        .companion-name { margin-top:6px; font-size:1.5rem; font-weight:bold; color:var(--accent);
            text-shadow:0 2px 8px #000; }
        .companion-line { margin-top:2px; font-size:1.1rem; color:#eee; font-style:italic;
            text-shadow:0 2px 8px #000; max-width:70vw; text-align:center; }
        .companion-box.is-down .companion-art { filter: grayscale(.8) drop-shadow(0 0 24px rgba(200,60,40,.6)); }
        @keyframes compIn { from { opacity:0; transform:translate(-50%,40px);} to { opacity:1; transform:translate(-50%,0);} }

        /* ЧИСЛА НА КАРТОЧКЕ ИСХОДА.
           Фоновой панели НЕТ — только рамка и цифры поверх рисунка, как в
           шаблоне автора. Читаемость держится обводкой текста, а не подложкой:
           подложка закрыла бы половину картинки, ради которой всё и рисовалось. */
        .outcome-wrap { position: relative; width: 320px; margin: 0 auto 10px; }
        /* КАРТОЧКА БЕЗ СЕРОЙ РАМКИ. Раньше картинка исхода вкладывалась в
           старый блок 300×400 с серым фоном и толстой рамкой, и он торчал из-под
           неё. Обёртка прозрачная, подпись отдельной плашкой под картинкой. */
        .combat-result-card { position: relative; width: 320px; background: transparent;
            border: 0; box-shadow: none; animation: popIn .3s cubic-bezier(.175,.885,.32,1.275); }
        .combat-result-card .outcome-wrap, .combat-result-card .outcome-card { margin: 0; }
        .combat-result-caption { box-sizing: border-box; width: 100%; margin-top: 8px;
            padding: 8px 12px; border: 1px solid #ea8d02; border-radius: 8px;
            background: rgba(18,14,10,.82); color: #ea8d02; text-align: left;
            font: 700 18px/1.35 Arial, sans-serif; overflow-wrap: anywhere; }
        .combat-result-caption .result-target, .combat-result-caption .result-damage { color: #e42e18; }
        /* ПАНЕЛЬ ЦИФР ПОВЕРХ КАРТОЧКИ.

           Была без подложки, «читаемость обводкой» — на пёстрой картинке
           цифры терялись. Теперь подложка лёгкая: сквозь
           неё видно рисунок, ради которого карточка и рисовалась, а цифры
           читаются с дивана.

           Панель нарочно уже и ниже картинки: рамка карточки нарисована
           прямо в файле, отдельным слоем её не уменьшить — значит панель
           не должна её закрывать. */
        /* ПОЛОЖЕНИЕ: середина панели на 5% НИЖЕ середины карточки. Верхний
           край при этом прибит: лишние ряды меток растят панель ТОЛЬКО
           ВНИЗ. Поэтому не transform по центру, а фиксированный top —
           иначе при четырёх бонусах панель поехала бы и вверх, на героя.
           Числа подобраны глазами на настоящих карточках: 39,5% + рост. */
        .card-nums { position: absolute; left: 21%; right: 21%; top: 39.5%;
                     background: rgba(18,14,10,.315);   /* заливка −30%, текст без изменений */
                     backdrop-filter: blur(2px);
                     border: 2px solid rgba(231,76,60,.85); border-radius: 12px;
                     padding: 10px 8px 12px; text-align: center;
                     box-shadow: 0 0 14px rgba(231,76,60,.45), inset 0 0 18px rgba(0,0,0,.245); }

        /* ЧИТАЕМОСТЬ ДЕРЖИТ ОБВОДКА БУКВ, а не глухой фон. Пока панель была
           плотной, цифры всё равно тонули в рисунке. paint-order кладёт
           обводку ПОД заливку, иначе она съедает букву изнутри. */
        .cn-label, .cn-raw, .cn-total, .cn-tag {
                    paint-order: stroke fill; -webkit-text-stroke: 3px #0c0805; }
        .cn-label { font-size: .72rem; letter-spacing: .12em; color: #f4e6c8;
                    text-transform: uppercase; -webkit-text-stroke-width: 2px; }
        /* ЦВЕТА ВЗЯТЫ ИЗ САМОЙ КАРТОЧКИ: заливка надписи «КРИТ!» и её
           обводка. Верхнее число повторяет заливку, нижнее — обводку
           (осветлённую, иначе на тёмной панели глохнет). */
        .cn-raw   { font-size: 3rem; font-weight: 900; color: #ea8d02; line-height: 1.05; }
        .cn-total { font-size: 3rem; font-weight: 900; color: #e42e18; line-height: 1.05; }
        .cn-line  { height: 1px; background: rgba(240,217,160,.55); margin: 6px 14px; }
        /* Метки переносятся по рядам: бонусов бывает и четыре (оружие,
           песня барда, баф жреца, крит), в одну строку они не лезут. */
        .cn-tags  { display: flex; flex-wrap: wrap; gap: 5px;
                    justify-content: center; margin-top: 8px; }
        .cn-tag   { font-size: .68rem; padding: 3px 10px; border-radius: 9px;
                    background: rgba(0,0,0,.385);
                    border: 1px solid rgba(240,217,160,.5); color: #f4e6c8;
                    -webkit-text-stroke-width: 2px; white-space: nowrap; }
        /* Слово оранжевое, число красное — перекликается с большими цифрами. */
        .cn-tag b { font-weight: 700; color: #ea8d02; }
        .cn-tag i { font-style: normal; font-weight: 800; color: #e42e18; margin-left: 3px; }
        .cn-tag.good { border-color: #ea8d02; }
        .cn-tag.bad  { border-color: rgba(231,76,60,.6); }
        .cn-tag.crit { border-color: #f5d76e; font-weight: bold; }
        .outcome-card { display:block; width: 320px; margin: 0 auto 10px;
            border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.7); }
        /* ОЖИДАНИЕ БРОСКА. Кубик катится, пока человек вбивает число; через
           15 секунд замирает и говорит, кого ждут. */
        /* ЗЕРКАЛО ХРАМА. Зритель ничего не нажимает — он смотрит, как это
           делает Ведущий: подсветка и вдавливание повторяются за ним. */
        .church-mirror { position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%); width: 62%; max-width: 900px;
            text-align: center; pointer-events: none; }
        .church-mirror .ch-head { font-size: 1.1rem; color: #f0d9a0;
            text-shadow: 0 2px 6px #000; margin-bottom: 8px; letter-spacing: .04em; }
        .church-mirror .ch-art { position: relative; line-height: 0; }
        .church-mirror .ch-art img { width: 100%; display: block;
            filter: drop-shadow(0 12px 30px rgba(0,0,0,.7)); }
        .church-mirror .ch-spot { position: absolute; border: 2px solid transparent;
            border-radius: 14px; transition: box-shadow .18s, border-color .18s,
            transform .1s, background .18s; }
        .church-mirror .ch-spot.lit { border-color: rgba(245,200,90,.9);
            background: rgba(245,200,90,.12);
            box-shadow: 0 0 26px rgba(245,200,90,.65), inset 0 0 26px rgba(245,200,90,.3); }
        .church-mirror .ch-spot.hit { transform: translateY(3px) scale(.98);
            box-shadow: inset 0 4px 16px rgba(0,0,0,.7), 0 0 22px rgba(245,200,90,.7); }

        .await-roll { position: absolute; inset: 0; display: flex;
                      flex-direction: column; align-items: center;
                      justify-content: center; gap: 14px; pointer-events: none; }
        .await-roll .await-dice { display: flex; gap: 18px; justify-content: center; }
        .await-roll .await-text { font-size: 1.3rem; font-weight: 700; color: #f0d9a0;
                      text-shadow: 0 2px 6px #000; letter-spacing: .04em; }
        .await-roll .await-text.waiting { color: #f1c40f; }
        .await-roll.stalled .spinning-dice-3d { filter: drop-shadow(0 0 18px rgba(241,196,15,.5)); opacity: .8; }
        .spinning-dice-3d { width: 250px; height: 250px; filter: drop-shadow(0 0 30px rgba(255,215,0,0.55)); }
        .spinning-dice-icon { width: 250px; height: 250px; object-fit: contain; filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8)); animation: spinDice 0.65s linear infinite; }
        /* Пара d10 (режим 2d10) — та же ось, что и одиночный кубик, но два изображения рядом.
           Направление (по/против часовой) назначается СЛУЧАЙНО в JS при каждом броске —
           поэтому классы spin-cw/spin-ccw не привязаны к позиции лево/право. */
        .spinning-dice-pair { display: flex; align-items: center; justify-content: center; gap: 0; }
        .spinning-dice-pair img { width: 170px; height: 170px; object-fit: contain; filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8)); margin: 0 -12px; }
        .spinning-dice-pair img.spin-cw  { animation: spinDiceCW 0.585s linear infinite; }
        .spinning-dice-pair img.spin-ccw { animation: spinDiceCCW 0.845s linear infinite; }
        @keyframes spinDiceCW  { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinDiceCCW { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        .dice-result-box { width: 300px; height: 400px; background: #2c2c2e; border: 5px solid #aaa; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 0 50px rgba(0,0,0,0.9); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: auto; }
        .dice-result-box.atk { border-color: #c0392b; box-shadow: 0 0 60px rgba(192, 57, 43, 0.8); }
        .dice-result-box.def { border-color: #2980b9; box-shadow: 0 0 60px rgba(41, 128, 185, 0.8); }
        .dice-result-box.skill { border-color: #f39c12; box-shadow: 0 0 60px rgba(243, 156, 18, 0.8); }
        .dice-label { font-size: 1.5rem; color: #aaa; text-transform: uppercase; margin-bottom: 10px; }
        .dice-who { font-size: 1.8rem; font-weight:bold; color: #fff; margin-bottom: 15px; text-align: center; text-transform: uppercase; text-shadow: 0 2px 5px black; }
        .dice-value { font-size: 8rem; font-weight: 900; color: white; line-height: 1; margin-bottom: 10px; }
        .dice-outcome { font-size: 1.5rem; font-weight: bold; text-transform: uppercase; }
        .dice-crit { color: #e67e22; text-shadow: 0 0 30px #e67e22; animation: pulse 0.5s infinite; }
        @keyframes spinDice { 0% { transform: rotate(0deg) scale(1); } 100% { transform: rotate(360deg) scale(1); } }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .loot-popup { background: #222; border: 4px solid #ffd700; padding: 20px; border-radius: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; box-shadow: 0 0 40px rgba(255, 215, 0, 0.5); animation: popIn 0.3s; color: white; pointer-events: auto; }

           уровня его нет вовсе — пустая строка честнее выдуманного

<script>
/* ═══════════════════════════════════════════════════════════
   ОТКУДА БЕРУТСЯ КАРТИНКИ: сеть или локальная папка
   ═══════════════════════════════════════════════════════════
   Подключать ПЕРВЫМ, до всех data-*.js: они склеивают полные пути прямо
   при загрузке (GITHUB_URL + "assets/..."), поэтому база должна быть
   известна раньше них. Переключение на лету поэтому и невозможно —
   только с перезагрузкой страницы.

   Раньше база была объявлена в ТРЁХ местах: своей строкой в app.js, своей
   в streamer-app.js и в оболочке дашборда. Разъехались бы при первой же
   смене адреса. Теперь одна.

   Настройка ПОУСТРОЙСТВЕННАЯ, а не общая на комнату. Иначе, переключив
   дашборд на локальную папку, ГМ сломал бы картинки на телефонах игроков:
   папки с ассетами у них нет и быть не может.
   ═══════════════════════════════════════════════════════════ */

(function (w) {
    var ONLINE = 'https://drdrum666.github.io/grivensburg-project/';
    var OFFLINE = '';            /* пусто = рядом с html: site/assets/... */
    var KEY = 'grivensburg_assets';

    function read() {
        try {
            var v = w.localStorage && w.localStorage.getItem(KEY);
            return v === 'offline' ? 'offline' : 'online';
        } catch (e) { return 'online'; }   /* localStorage закрыт — работаем из сети */
    }

    /* Адрес можно задать и ссылкой: ?assets=offline. Нужно стримеру и
       клиенту, у которых своей кнопки нет. Выбор запоминается. */
    try {
        var q = new URLSearchParams(w.location && w.location.search || '');
        var forced = q.get('assets');
        if (forced === 'offline' || forced === 'online') {
            w.localStorage.setItem(KEY, forced);
        }
    } catch (e) { /* не вышло — не страшно */ }

    var mode = read();

    w.ASSET_MODE = mode;
    w.GITHUB_URL = (mode === 'offline') ? OFFLINE : ONLINE;

    /* Переключить и перезагрузить. Зовёт кнопка в дашборде. */
    w.setAssetMode = function (next) {
        try { w.localStorage.setItem(KEY, next === 'offline' ? 'offline' : 'online'); }
        catch (e) { return false; }
        if (w.location && w.location.reload) w.location.reload();
        return true;
    };
    w.toggleAssetMode = function () {
        return w.setAssetMode(read() === 'offline' ? 'online' : 'offline');
    };

    /* Достроить путь. Готовые ссылки не трогаем. */
    w.assetUrl = function (path) {
        if (!path) return '';
        var p = String(path);
        if (p.indexOf('http') === 0) return p;
        /* ПРОБЕЛЫ И СКОБКИ В ИМЕНАХ. У части файлов они есть: «groovy_riff .png»
           с пробелом перед точкой, «suchkam trash (5).mp3». Без кодирования
           браузер такой адрес не находит и МОЛЧА показывает пустоту — ровно
           так же, как при опечатке в имени.

           Кодируем каждое звено пути отдельно, чтобы косые уцелели: закодируй
           их — и путь развалится целиком. То же делает soundUrl для звука. */
        return w.GITHUB_URL + p.split('/').map(encodeURIComponent).join('/');
    };

    /* В разметке остались прямые ссылки: иконки кубиков, фон шапки, сундук
       лута. Часть из них сидит внутри <style>, поэтому в js их не подменить
       по одной. Разово переписываем при загрузке — один проход, не в слое
       отрисовки. Онлайн-режим ничего не трогает.

       Оба адреса ниже — исторические: часть картинок бралась с github.io,
       часть с raw.githubusercontent. Оставлены оба, чтобы старая разметка
       переключалась целиком. */
    if (mode === 'offline' && typeof document !== 'undefined') {
        var PREFIXES = [
            'https://drdrum666.github.io/grivensburg-project/',
            'https://raw.githubusercontent.com/drdrum666/grivensburg-project/main/'
        ];
        var strip = function (text) {
            for (var i = 0; i < PREFIXES.length; i++) {
                text = text.split(PREFIXES[i]).join(OFFLINE);
            }
            return text;
        };
        var sweep = function () {
            var i, n;
            var styles = document.getElementsByTagName('style');
            for (i = 0; i < styles.length; i++) styles[i].textContent = strip(styles[i].textContent);
            var imgs = document.getElementsByTagName('img');
            for (i = 0; i < imgs.length; i++) {
                var src = imgs[i].getAttribute('src');
                if (src) imgs[i].setAttribute('src', strip(src));
            }
            var all = document.querySelectorAll('[style*="drdrum666"]');
            for (i = 0, n = all.length; i < n; i++) {
                all[i].setAttribute('style', strip(all[i].getAttribute('style')));
            }
        };
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', sweep);
        } else sweep();
    }
})(typeof window !== 'undefined' ? window : globalThis);

</script>

 function set(room,patch){const previous=read(room),value=clean({...previous,...patch});if(JSON.stringify(value)===JSON.stringify(previous))return value;memory.set(key(room),value);try{localStorage.setItem(key(room),JSON.stringify(value))}catch{}emit(room,value);return value;}

<script>
/* Fit only the three card rows. All lengths are measured afresh at scale 1. */
(function(w){
 'use strict';
 function layout({root,area,size=80,mobile=false}){
  if(!root||!area)return null;
  const gap=18*(1-Math.max(0,Math.min(100,size))/100);
  const specs=[['party-layer','.player-wrapper'],['queue-layer','.queue-card'],['enemies-layer','.enemy-card']];
  const rows=[];
  for(const[id,selector]of specs){
   const row=document.getElementById(id),body=row?.querySelector('.stream-row-body');if(!row||!body)continue;
   const nodes=[...body.querySelectorAll(':scope > '+selector)];
   row.style.display=row.classList.contains('hidden')||!nodes.length?'none':'block';if(row.style.display==='none')continue;
   body.style.gap=gap+'px';body.style.transform='none';body.style.width='max-content';
   const reserve=id==='party-layer'?24:0;
   body.style.paddingLeft=reserve+'px';
   const h=Math.max(...nodes.map(n=>n.offsetHeight))+8;
   const full=reserve+nodes.reduce((a,n)=>a+n.offsetWidth,0)+Math.max(0,nodes.length-1)*gap;
   // Portrait screens expose a scrollable row rather than shrinking seven heroes to stamps.
   const visible=mobile?nodes.slice(0,id==='queue-layer'?6:2):nodes;
   const width=reserve+visible.reduce((a,n)=>a+n.offsetWidth,0)+Math.max(0,visible.length-1)*gap;
   rows.push({row,body,nodes,h,full,width,reserve});
  }
  const width=area.clientWidth,height=area.clientHeight;
  if(!width||!height||!rows.length)return null;
  const maxScale=Math.min(width/Math.max(...rows.map(r=>r.width)),height/rows.reduce((a,r)=>a+r.h,0));
  const scale=maxScale*(.40+.60*Math.max(0,Math.min(100,size))/100);
  const free=Math.max(0,height-rows.reduce((a,r)=>a+r.h*scale,0));
  let y=rows.length===1?free/2:0;
  for(const r of rows){
   const old=r.row.scrollLeft;r.row.style.top=y+'px';r.row.style.height=r.h*scale+'px';
   r.body.style.transform=`scale(${scale})`;r.body.style.width=r.full+'px';r.body.style.height=r.h+'px';
   let spacer=r.row.querySelector('.stream-row-space');if(!spacer){spacer=document.createElement('div');spacer.className='stream-row-space';r.row.prepend(spacer)}
   spacer.style.width=Math.max(width,r.full*scale)+'px';spacer.style.height=r.h*scale+'px';
   r.row.scrollLeft=old;y+=r.h*scale+(rows.length>1?free/(rows.length-1):0);
  }

/* ЧИСЛО ИЗ ЧЕГО УГОДНО, ноль вместо мусора.

   молча становилась нулём. Тихо ломалось всё, что дробное:

     - сила крита от опьянения: на 60% прибавка 0.75 превращалась в 0, и
       пьяный крит бил ×1.5 вместо ×2.25 — то есть пьянство не давало
       НИЧЕГО из обещанного;
     - амулет «Синяя Слеза» с `critPower: 0.15` не давал ничего;
     - шанс задеть своего (0.02 … 0.15) обнулялся везде, где проходил
       через num.

   срабатывало, и прибавка даже не пыталась сложиться.

   Почему не поймали проверки: в tests.js свой `num` на `Number`. Проверка
   собирала ожидаемое число своей функцией и зеленела на сломанном расчёте.
   Правило должно жить в одном месте — здесь оно жило в двух.

   Берём `parseFloat`, а не `Number`: он, как и прежний `parseInt`, читает
   число с начала строки и не давится хвостом. Где нужно целое — округляем
   явно, а не надеемся на побочный эффект разбора. */
function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
/* Математическое округление вверх без ложного +1 от 14.000000000000002.
   Очень малый положительный эффект остаётся положительным (ceil → 1). */

        .map(function (k) { return String(k).toLowerCase(); });
}
function hasKeyword(ids, list) {
    return ids.some(function (id) {
        return list.some(function (w) { return id.indexOf(w) !== -1; });
    });
}

/* Бросок кубика. mode: 'd10' (2d10 => 2..20) | 'd20' (1..20). */
function rollDice(mode, rng) {
    var r = rng || Math.random;
    if (mode === 'd20') return { total: 1 + Math.floor(r() * 20), dice: null };
    var a = 1 + Math.floor(r() * 10), b = 1 + Math.floor(r() * 10);
    return { total: a + b, dice: [a, b] };
}
function diceMin(mode) { return mode === 'd20' ? 1 : 2; }

/* РАЗБОР ВВОДА БРОСКА — один на клиент и дашборд (ТЗ кубиков, пункт 19).

   D20 — одно целое от 1 до 20. 2D10 — ДВА целых через пробел, каждое от 1 до
   10: «8 9», «1 10». Одну общую сумму вроде «17» не принимаем: из неё не
   восстановить настоящую пару, а анимации и проверке честности нужны именно
   грани. Для попадания считается сумма — rawTotal.

   Возвращает { faces, rawTotal } или null. Сам по себе ничего не меняет: где
   его звать и как показывать отказ, решает экран. */
function parseRollInput(raw, mode) {
    if (mode === 'd20') {
        var t = String(raw === undefined || raw === null ? '' : raw).trim();
        if (!/^\d+$/.test(t)) return null;
        var n = Number(t);
        return (n >= 1 && n <= 20) ? { faces: [n], rawTotal: n } : null;
    }
    var части = String(raw === undefined || raw === null ? '' : raw).trim().split(/\s+/);
    if (части.length !== 2) return null;
    for (var i = 0; i < 2; i++) {
        if (!/^\d+$/.test(части[i])) return null;
        var v = Number(части[i]);
        if (v < 1 || v > 10) return null;
    }
    var a = Number(части[0]), b = Number(части[1]);
    return { faces: [a, b], rawTotal: a + b };
}

function getRole(who, world) {
    var cls = who.cls;
    if (cls==='priest' && who.id && world && meleeAttackersOn(who.id,world.enemies)>0)return 'front';
    if (cls === 'priest' && (who.position === 'front' || who.position === 'back')) return who.position;
    var ids = keysOf(who.mainhand, who.offhand);
    if (cls === 'warrior') return 'front';                       // воин — всегда фронт
    if (hasKeyword(ids, WEAPON_KEYS.frontal)) return 'front';    // щит/меч/топор/булава
    if (hasKeyword(ids, WEAPON_KEYS.stealth)) return 'stealth';  // кинжал/нож
    return 'back';                                               // лук/посох/жезл/пусто
}

function roleIcon(role) {
    if (role === 'front') return '🛡️';
    if (role === 'stealth') return '🗡️';
    return '🏹';
}

/* Разбойник = лучник с кинжалами. Отдельного класса нет. */
/* Разбойником делает ВТОРОЙ кинжал, а не первый. С одним кинжалом лучник
   остаётся лучником: при нём и классовая инициатива, и никакой скрытности.
   Раньше роль stealth (а с ней Присутствие, невидимость и выбор цели)
   включалась уже с одного кинжала — это расходилось с правилом стола. */
function isRogue(who) {
    return who.cls === 'archer' && getRole(who) === 'stealth' && hasDualDaggers(who);
}

/* Два кинжала в руках — нужно для бонуса шанса крита (раздел 7). */
function hasDualDaggers(who) {
    var mh = String(who.mainhand || '').toLowerCase();
    var oh = String(who.offhand || '').toLowerCase();
    var isD = function (id) { return hasKeyword([id], WEAPON_KEYS.stealth); };
    return !!mh && !!oh && isD(mh) && isD(oh);
}

   4. ФИЛЬТР ПРЕДМЕТОВ  (болячка №6 — одна функция на весь проект)
   Используется И при надевании, И в магазине. Второй копии быть не должно.

/* Явный тип рук; fallback поддерживает старые каталоги комнат. */
function equipmentKind(item) {
    if (!item) return '';
    if (item.equipmentKind) return item.equipmentKind;
    var s=String(item.icon || '').toLowerCase();
    if (/hunt_knife/.test(s)) return 'tool_knife';
    if (/dagger|knife/.test(s)) return 'dagger';
    if (/shield/.test(s)) return 'shield';
    if (/crossbow|bow/.test(s)) return 'bow';
    if (/staff/.test(s)) return 'staff';
    if (/wand/.test(s)) return 'wand';
    if (/sword|axe|mace/.test(s)) return 'weapon';
    if (/lute/.test(s) || (item.slot==='mainhand' && (item.classes || []).indexOf('bard')>=0)) return 'instrument';
    if (item.isLight) return 'tool';
    if (item.slot==='offhand' && (/frog/.test(s) || (item.classes || []).some(function(c){return c==='mage'||c==='priest';}))) return 'focus';
    return '';
}
function canEquip(item, cls, slot) {
    if (!item) return false;
    if (cls==='rogue') cls='archer';
    if (slot) {
        var type=slot.indexOf('magic')===0?'magic':/^relic[12]$/.test(slot)?'relic':slot==='ring2'?'ring':slot;
        if(item.slot!==type && !(slot==='offhand' && item.slot==='mainhand' && !item.isTwoHanded))return false;
    }

    /* ДОСТУПНО ВСЕМ ТОЛЬКО ТО, ЧТО НЕ БРОНЯ: расходники, квестовое,
       бижутерия и реликвии.

       Пояс, перчатки и левая рука раньше стояли в этом же списке — и
       правило их вообще не спрашивало. В базе у них классы расписаны верно
       (воину латные перчатки, лучнику кожаные, магу с жрецом ветхие), но
       проверка до них не доходила: бард спокойно надевал латные перчатки и
       железный пояс, а щит воина брал кто угодно.

       Теперь броня целиком идёт по папке класса, как и задумано: воин в
       латах, лучник в коже, маг с жрецом и бардом в тряпье. */
    if (item.type === 'consumable' || item.type === 'quest') return true;
    if (item.slot === 'ring' || item.slot === 'amulet' || item.slot === 'relic') return true;

    if (item.slot==='mainhand' || item.slot==='offhand') {
        var kind=equipmentKind(item), kinds={warrior:['weapon','shield'],archer:['dagger','bow'],
            mage:['staff','wand','focus'],priest:['weapon','staff','wand','shield','focus'],bard:['instrument']};
        /* Инструменты можно купить для рюкзака. Нож как оружие — только лучнику. */
        if (kind==='tool_knife') return !slot || cls==='archer';
        if (kind==='tool') return !slot || cls!=='priest';
        /* Магический посох доступен жрецу; двуручное оружие воина — нет. */
        if (cls==='priest' && item.isTwoHanded && kind!=='staff') return false;
        if (kind && (kinds[cls] || []).indexOf(kind)<0) return false;
        if (slot==='offhand' && cls==='priest' && ['shield','focus'].indexOf(kind)<0)return false;
        if (slot==='offhand' && item.slot==='mainhand' && !((cls==='archer' && kind==='dagger') || (cls==='warrior' && kind==='weapon')))return false;
        if (kind) return true;
    }

    /* Магия — по назначению заклинания. */
    if (item.slot === 'magic') {
        if (item.subtype === 'utility') return cls === 'warrior';   // агро
        if (item.subtype === 'heal')    return cls === 'priest';
        if (item.subtype === 'buff' || item.subtype === 'debuff') return cls === 'bard';
        return cls === 'mage' || cls === 'priest';                  // атакующая
    }

    /* Снаряжение — по папке класса. Тег 'all' означает «доступно всем». */
    var folders = GEAR_FOLDERS[cls] || [];
    if (!item.classes) return false;
    if (item.classes.indexOf('all') !== -1) return true;
    return folders.some(function (f) { return item.classes.indexOf(f) !== -1; });
}

/* Не удаляет вещи из инвентаря: снимает только недопустимое снаряжение. */
function legalHeroSlots(player, items) {
    var p=player || {}, out=Object.assign({},p.slots || {});
    Object.keys(out).forEach(function(slot){
        if(out[slot] && !canEquip((items || {})[out[slot]],p.cls,slot))out[slot]='';
    });

function heroEquipmentVitals(player, items, world) {
    var p=player || {}, total=heroStats(p,items).total;
    var base=computeVitals({cls:p.cls,total:total});
    var prayer=prayerBonus(p,world || {},base.maxHP,total.int);
    var vitals=computeVitals({cls:p.cls,total:Object.assign({},total,{int:total.int+prayer.int})});
    vitals.maxHP+=prayer.hp;
    return Object.assign(vitals,sicknessVitals(vitals,p,world || {}));

function equipmentVitalsFacts(player, items, world) {
    var p=player || {}, v=heroEquipmentVitals(p,items,world);
    return {hp:clampToMax(p.hp,v.maxHP),mp:clampToMax(p.mp,v.maxMP),
        maxHP:v.maxHP,maxMP:v.maxMP,resource:clampToMax(p.resource,v.maxResource)};
}
/* Смена снаряжения сохраняет потраченные HP/MP: прибавка максимума
   пополняет ресурс, уменьшение снимает ту же величину. Если снять уже
   потраченный бонус у нижней границы, остаток запоминается: повторное
   надевание не создаёт лечение из воздуха. Полное восстановление снимает
   этот остаток. Снятие вещи не убивает, надевание не воскрешает. */
function sameEquipmentSlots(a, b) {
    a=a || {}; b=b || {};
    return Object.keys(Object.assign({},a,b)).every(function(k){return (a[k] || '')===(b[k] || '');});
}
function changeEquipmentFacts(player, slots, items, world) {
    var p=player || {}, before=heroEquipmentVitals(p,items,world);
    var after=heroEquipmentVitals(Object.assign({},p,{slots:slots}),items,world);
    var debt=Object.assign({hp:0,mp:0},p.equipmentDebt || {}), facts={};
    ['hp','mp'].forEach(function(k){
        var maxKey=k==='hp'?'maxHP':'maxMP', oldMax=before[maxKey], max=after[maxKey];
        var current=clampToMax(p[k],oldMax), floor=k==='hp' && current>0 ? Math.min(1,max) : 0;
        var rest=Math.max(0,num(debt[k]));
        if(current>=oldMax && oldMax>0)rest=0;
        if(k==='hp' && current<=0){facts.hp=0;debt.hp=0;return;}
        var delta=max-oldMax;
        if(delta>0){var used=Math.min(rest,delta);rest-=used;current+=delta-used;}
        else if(delta<0){current+=delta;if(current<floor){rest+=floor-current;current=floor;}}
        facts[k]=Math.max(floor,Math.min(max,current));debt[k]=rest;
    });
    return Object.assign(facts,{maxHP:after.maxHP,maxMP:after.maxMP,
        resource:clampToMax(p.resource,after.maxResource),equipmentDebt:debt,
        relicUsedDay:relicCooldowns(p)});

/* Рост статов. Числа расписаны внутри функции, у самого цикла — здесь их
   намеренно НЕТ, чтобы не было второго места, которое надо не забыть
   поправить. Тут стояло «главный +1 за уровень, остальные +1 каждые три»:
   правило отменено, а подпись пережила его и врала читающему. */
function computeStats(p) {
    var cls = CLASS_TABLE[p.cls] ? p.cls : 'warrior';
    var tbl = CLASS_TABLE[cls];
    var race = p.raceBonus || RACE_BONUSES[p.race] || {};
    var gear = p.gearStats || {};
    var lvl = Math.max(1, num(p.level));

    /* РОСТ СТАТОВ. Главный +2 за уровень, каждый побочный +1 за уровень.
       Было: главный +1, побочные +1 каждые три уровня — побочные почти не
       росли, и половина партии всю игру сидела с нулевой инициативой.

       ЖРЕЦ РАЗМЕНИВАЕТ интеллект на силу: чётный уровень +2 и +2,
       нечётный +1 и +1. Поэтому он крепче мага, но беднее маной — ровно
       посередине между ним и воином. */
    var base = {}, total = {};
    var grown = {};
    STATS.forEach(function (s) { grown[s] = num(tbl.base[s]); });

    for (var lv = 2; lv <= lvl; lv++) {
        if (cls === 'priest') {
            var big = (lv % 2 === 0);
            grown.int += big ? 2 : 1;
            grown.str += big ? 2 : 1;
            grown.agi += 1;
            grown.cha += 1;
        } else {
            STATS.forEach(function (s) {
                grown[s] += (tbl.main === s) ? 2 : 1;
            });
        }
    }

    STATS.forEach(function (s) {
        base[s] = grown[s] + num(race[s]);
        total[s] = base[s] + num(gear[s]);
    });
    return { base: base, gear: gear, total: total, mainStat: tbl.main };
}

/* Общая версия максимума/миграция: расчёт с нуля, запись — у вызывающего.
   Расовые бонусы пока нулевые, но все экраны используют одну таблицу. */
var HP_FORMULA_VERSION = 2;
var RACE_BONUSES = { human:{str:0,agi:0,int:0,cha:0}, orc:{str:0,agi:0,int:0,cha:0},
    drow:{str:0,agi:0,int:0,cha:0}, elf:{str:0,agi:0,int:0,cha:0} };
var HERO_XP = [0,1000,2500,5200,9200,14700,21700,30200,40200,52200,66200,82200,
    100200,121200,145200,172200,202200,237200,277200,322200];
function heroLevel(player) {
    var p=player || {}, level=1;
    if (p.xp == null) return Math.max(1,num(p.level) || 1);
    HERO_XP.forEach(function(x,i){if(num(p.xp)>=x)level=i+1;});
    return level;
}
function heroStats(player, items) {
    var p=player || {}, gear={str:0,agi:0,int:0,cha:0};
    Object.keys(p.slots || {}).filter(function(slot){return slot.indexOf('magic')!==0;}).forEach(function(slot){
        var it=(items || {})[p.slots[slot]] || {}, st=it.stats || {};
        STATS.forEach(function(k){gear[k]+=num(st[k]);});
    });
    return computeStats({cls:p.cls,level:heroLevel(p),race:p.race,raceBonus:p.raceBonus,gearStats:gear});
}
function strengthMaxHP(strength, player, world, legacy) {
    var base=ceilGame(10+num(strength)*(legacy ? 2 : 3));
    var normal=base+prayerBonus(player || {},world || {},base,0).hp;
    return sicknessMaxHP(normal,player || {},world || {});
}
function upgradeHeroState(player, items, world) {
    var p=player || {}, facts={};
    if(p.relicUsedDay && JSON.stringify(p.relicUsedDay)!==JSON.stringify(relicCooldowns(p)))
        facts.relicUsedDay=relicCooldowns(p);
    if (num(p.hpFormulaVersion)<HP_FORMULA_VERSION) {
        var strength=heroStats(p,items).total.str;
        var oldMax=strengthMaxHP(strength,p,world,true), nextMax=strengthMaxHP(strength,p,world,false);
        var hp=num(p.hp);
        facts.hp=p.hp == null ? nextMax : hp>0 && hp===oldMax ? nextMax : Math.max(0,Math.min(hp,nextMax));
        facts.maxHP=nextMax; facts.hpFormulaVersion=HP_FORMULA_VERSION;
    }
    if(p.cls==='priest' && p.position!=='front' && p.position!=='back')
        facts.position=getRole({cls:p.cls,mainhand:(p.slots || {}).mainhand,offhand:(p.slots || {}).offhand});
    var legal=legalHeroSlots(p,items);
    if (JSON.stringify(legal)!==JSON.stringify(p.slots || {})) {
        facts.slots=legal;
        Object.assign(facts,equipmentVitalsFacts(Object.assign({},p,facts),items,world));
    }
    return facts;
}
/* Полные снимки героя в квитанциях тоже мигрируют: отмена старой операции
   не должна вернуть старую версию формулы и повторно заполнить HP. */
function upgradeHeroTree(value, items, world) {
    if(!value || typeof value!=='object')return value;
    var out=Array.isArray(value) ? [] : {};
    Object.keys(value).forEach(function(k){out[k]=upgradeHeroTree(value[k],items,world);});
    if(CLASS_TABLE[out.cls] && ('hp' in out) && ('slots' in out || 'xp' in out))
        Object.assign(out,upgradeHeroState(out,items,world));
    return out;
}

/* HP: 10 + сила×3 у ВСЕХ классов, жрецу прибавки за интеллект нет.
   Мана: интеллект×2 у всех. Очко в очко, без процентов (см. computeVitals). */
/* ══════════════════════════════════════════════════════════════════════
   СТУПЕНИ СТАТОВ: первая на 10, дальше каждые 5 (10, 15, 20, 25…).

   Считаем от ИТОГОВОГО стата — значит ступень можно добрать снаряжением, а
   не только уровнем.

   HP и ману ступени НЕ трогают. От ступеней растут:
      сила       шкала Ярости воина: 10 + 2 за ступень
      харизма    шкала Настроения барда: 15 + 2 за ступень
      интеллект  Аркана мага за каст: +2 за ступень (за фокус +1)
   Инициатива и порог крита считаются от ловкости напрямую, без ступеней
   (см. computeCombatValues).

   Было: проценты за каждые полные 10 пунктов (+10% HP за силу, +10% маны
   за интеллект и т.д.). Отменены — шкалы считаются очко в очко. */
var STAT_STEP = 5;
var STAT_FLOOR = 10;
/* Ресурсные ступени начинаются на 10, затем 15, 20, 25 и далее. */
function statSteps(v) {
    var n = num(v);
    return n < STAT_FLOOR ? 0 : Math.floor((n - STAT_FLOOR) / STAT_STEP) + 1;
}

function computeVitals(p) {
    var cls = CLASS_TABLE[p.cls] ? p.cls : 'warrior';
    var t = p.total || { str: 0, agi: 0, int: 0, cha: 0 };

    /* ШКАЛЫ СЧИТАЮТСЯ ОЧКО В ОЧКО, без процентов и множителей.

       Было: проценты за ступени статов и множитель маны у мага и жреца.
       Проценты почти ничего не давали тем, у кого стат побочный — бард и
       лучник получали +1 HP за всю игру, — зато разгоняли разрыв у тех,
       кто его качает. Множители делали то же самое с маной.

       Классы теперь различаются РОСТОМ СТАТОВ, а не коэффициентами:
       у жреца свой размен интеллекта на силу, и этого достаточно. */
    var maxHP = ceilGame(10 + num(t.str) * 3);
    var maxMP = ceilGame(num(t.int) * 2);

    /* Шкалы ресурсов растут от своего стата одинаково: +2 за ступень.
       Ярость — от силы, Настроение — от харизмы. Раньше ярость была
       жёсткой константой с пометкой «формула не согласована». */
    var kind = CLASS_TABLE[cls].resource;
    var maxResource = kind === 'rage' ? (RAGE_BASE + statSteps(t.str) * RAGE_PER_STEP)
                    /* Настроение: 15 + 2 за СТУПЕНЬ харизмы, как ярость от
                       силы (решение автора 27.09.2026, «как в гайде»). Было
                       +1 за каждое очко: бард с 10 харизмы начинал с 25, а
                       к 15 уровню шкала раздувалась до 48 против 25. */
                    : kind === 'mood' ? (MOOD_BASE + statSteps(t.cha) * MOOD_PER_STEP)
                    : maxMP;
    /* hpBonus и mpBonus остаются нулями: пороговых прибавок больше нет, а
       поля читает интерфейс — выбрасывать их значит ломать его молча. */
    return { maxHP: maxHP, maxMP: maxMP, resourceKind: kind, maxResource: maxResource,
             hpBonus: 0, mpBonus: 0 };
}

/* Стойкость (steadfast): постоянная классовая защита от итогового стата.
   Воин — сила, жрец — интеллект; +1 на 15, 25, 35 и далее. */
function steadfastDefense(cls, total) {
    var t = total || {};
    var stat = cls === 'warrior' ? t.str : cls === 'priest' ? t.int : 0;
    return Math.max(0, Math.floor((num(stat) - 5) / 10));
}

/* Производные боевые числа. Порог крита снижается шансом крита. */
function computeCombatValues(p) {
    var cls = CLASS_TABLE[p.cls] ? p.cls : 'warrior';
    var t = p.total || {};
    var gear = p.gear || {};

    var rogue = !!p.isRogue;
    /* Разбойник — это лучник С ДВУМЯ КИНЖАЛАМИ, отдельного класса нет. */
    var dualRogue = rogue && !!p.dualDaggers;

    /* История порога крита: сначала он рос за уровень персонажа (не зависел
       ни от вещей, ни от кинжалов), потом — по −1 за каждые 10 ловкости и
       только у разбойника. Оба правила отменены; действует то, что ниже. */
    /* ПОРОГ КРИТА: −1 за каждые полные 15 ловкости, у ВСЕХ классов.
       Разбойнику дополнительно −1 сразу за второй кинжал — это его размен
       за потерянную классовую инициативу лучника. */
    var critChance = num(gear.critChance)
        + Math.floor(num(t.agi) / 15)
        + (dualRogue ? 1 : 0);

    /* Лучник получает +1 к инициативе с первого уровня — это его классовый
       бонус. Взял два кинжала: бонус УХОДИТ, взамен −1 к порогу крита.
       В этом и размен: стрелок ходит раньше, разбойник бьёт больнее. */
    /* Инициатива считается прямо от ловкости, а не по ступеням статов:
       ступени начинаются с десятки, и на старте инициативы не было бы ни у
       кого. Здесь стояло «классового +1 лучнику больше нет, разбойник
       ничего не теряет» — неверно: единица есть, и разбойник её теряет. */
    /* ИНИЦИАТИВА: +1 за каждые полные 5 ловкости у всех, плюс классовая
       единица лучника. Взяв второй кинжал, он становится разбойником и
       ЭТУ единицу теряет — взамен получает крит. Размен читается: кинжалы
       подбираются, а не стреляют первыми. */
    var init = Math.floor(num(t.agi) / 5) + num(gear.init)
        + (cls === 'archer' && !dualRogue ? 1 : 0);

    var lightBonus = (p.isDark && p.hasLight) ? 2 : 0;

    return {
        atk: num(gear.atk) + lightBonus,
        def: num(gear.def) + steadfastDefense(cls, t),
        init: init,
        luck: num(gear.luck),
        critChance: critChance,
        critPower: num(gear.critPower),
        critThreshold: T.crit - critChance,
        lightBonus: lightBonus
    };
}

/* ==========================================================================
   6. СЛОИСТЫЙ РАСЧЁТ БРОСКА  (раздел 2 — ГЛАВНОЕ ТРЕБОВАНИЕ)

   БРОСОК -> [БАЗОВЫЙ] -> [РОЛЬ] -> [КЛАСС] -> [ЭФФЕКТЫ] -> finalize()

   Слои НЕ определяют исход. Они только накапливают поправки в аккумуляторе.
   Исход считает finalize() ОДИН раз, из финальных чисел. Поэтому «забыть
   сбросить» нечего: каждый вызов начинается с чистого аккумулятора.
   ========================================================================== */

function newAcc(raw) {
    return {
        raw: raw,           // что реально выкинул игрок
        total: raw,         // бросок + все поправки
        critThreshold: T.crit,
        critPower: 0,
        damageBonus: 0,
        baseDamage: 0,
        flags: [],
        parts: []           // разложение для карточки броска
    };
}
function part(acc, layer, label, value) {
    acc.parts.push({ layer: layer, label: label, value: (value === undefined ? null : value) });
    return acc;
}
function flag(acc, name) { if (acc.flags.indexOf(name) === -1) acc.flags.push(name); return acc; }

/* --- Слой 1: БАЗОВЫЙ ---------------------------------------------------- */
function layerBase(acc, ctx) {
    var a = ctx.attacker;
    part(acc, 'base', 'Бросок', acc.raw);
    if (num(a.combat.atk)) { acc.total += num(a.combat.atk); part(acc, 'base', 'Атака', num(a.combat.atk)); }
    if (num(a.combat.luck)) { acc.total += num(a.combat.luck); part(acc, 'base', 'Удача', num(a.combat.luck)); }
    if (num(a.combat.critChance)) {
        acc.critThreshold -= num(a.combat.critChance);
        part(acc, 'base', 'Шанс крита', -num(a.combat.critChance));
    }
    acc.critPower += num(a.combat.critPower);

    /* Базовый урон: физика — главный стат, магия — урон заклинания
       (spellDamage, запасной 6) + интеллект. */
    if (ctx.action === 'spell') {
        /* СВОЙ УРОН У КАЖДОГО ЗАКЛИНАНИЯ. Здесь стояла шестёрка для всех
           без разбора: огненная стрела (тогда ещё «огненный шар») и
           ледяной шип били одинаково, хотя у шипа удар слабее, зато он
           морозит. Число берём из самого заклинания, шестёрка остаётся
           запасной — для старых свитков, у которых поля ещё нет. */
        var spellBase = num((ctx.spell || {}).spellDamage) || 6;
        acc.baseDamage = spellBase + num(a.total.int);
        part(acc, 'base', 'Урон магии (' + spellBase + '+инт)', acc.baseDamage);
    } else {
        /* ЧЕМ БЬЁТ. Правило боя без оружия жило только здесь, в движке, и
           его не звал никто: бард без лютни бил всей харизмой, воин без
           меча — всей силой. Теперь решает единый расчёт удара — по рукам,
           которые передал зовущий. Рук не передали — считаем, что оружие
           есть, как было: читающая сторона переживает отсутствие полей. */
        var руки = armedState(a);
        if (руки === 'none') {
            acc.baseDamage = 0;
            flag(acc, 'no_attack');
            part(acc, 'base', 'Без инструмента не дерётся', 0);
        } else if (руки === 'bare') {
            acc.baseDamage = unarmedDamage(a, a.total);
            part(acc, 'base', 'Урон без оружия (половина стата)', acc.baseDamage);
        } else {
            acc.baseDamage = num(a.total[a.mainStat]);
            part(acc, 'base', 'Урон (главный стат)', acc.baseDamage);
        }
    }
    return acc;
}

/* --- Слой 2: РОЛЬ ------------------------------------------------------- */
function layerRole(acc, ctx) {
    var role = ctx.attacker.role;
    var tgt = ctx.target || {};
    if (role === 'front' && tgt.role === 'back') {
        flag(acc, 'intercept_check');           // раздел 6, случай А
        part(acc, 'role', 'Прорыв к дальнему — возможен перехват');
    }
    if (role === 'stealth') {
        flag(acc, 'applies_presence');          // раздел 7
        part(acc, 'role', 'Скрытная атака');
    }
    /* «АТАКА С ДИСТАНЦИИ» УБРАНА ИЗ ОКНА. Строка не несла числа и ничего не
       добавляла: то, что герой бьёт из задней линии, игрок и так видит по
       своей роли. Вместе со строкой ниже про силу музыки она давала барду
       две подписи подряд об одном и том же. Правило не менялось — исчезла
       только подпись. */
    return acc;
}

/* --- Слой 3: КЛАСС ------------------------------------------------------ */
function layerClass(acc, ctx) {
    var a = ctx.attacker;
    /* ФЛАГ ОСТАЁТСЯ, ПОДПИСЬ УХОДИТ. «Сила музыки (дальняя)» тоже была без
       числа и повторяла то же, что и убранная «Атака с дистанции»: бард
       бьёт издалека. Сам флаг `ranged_music` не трогаем — он часть правила,
       а не оформления. */
    if (a.cls === 'bard') flag(acc, 'ranged_music');

    /* БАРД НА ПУСТОМ НАСТРОЕНИИ ВСЁ РАВНО БЬЁТ.

       Раньше на нуле он не мог вообще ничего, кроме защиты, — то есть
       выбывал из боя, пока кто-нибудь не нальёт. Игрок сидел и смотрел.

       Теперь бьёт, но с −1 к броску. Крит снимается ОТДЕЛЬНЫМ правилом
       (флаг no_crit ниже): одной единицы в итоге не хватает, чтобы до
       порога не достать.

       На ПЕСНИ это не распространяется: у них своя цена в Настроении, её
       стережёт canSing. Здесь речь только про удар. */
    if (a.cls === 'bard' && ctx.action !== 'spell' && num(a.resource) <= 0) {
        acc.total += BARD_EMPTY_MOOD;
        part(acc, 'class', 'Пустое Настроение', BARD_EMPTY_MOOD);
        /* КРИТА НА ПУСТОЙ ШКАЛЕ НЕТ.

           Замысел был такой: поправка идёт в итог, а крит считается от
           итога — значит двадцатка станет девятнадцатью и до порога не
           достанет. Одной единицы для этого НЕ ХВАТАЕТ: порог крита 19, а
           не 20, и девятнадцать его как раз берут. У пьяного или разбойника
           порог ещё ниже.

           Поэтому крит снимаем прямо: на пустом Настроении его нет. */
        flag(acc, 'no_crit');
    }

    if (ctx.action === 'spell' && ctx.spell && num(ctx.spell.power)) {
        acc.damageBonus += num(ctx.spell.power);
        part(acc, 'class', 'Сила заклинания', num(ctx.spell.power));
    }
    return acc;
}

/* --- Слой 4: ЭФФЕКТЫ ---------------------------------------------------- */
function layerEffects(acc, ctx) {
    /* Опьянение и Бадун не лежат в effects — они вычисляются из ступени и
       номера боя, поэтому подмешиваются здесь и залипнуть не могут.

       Дубли по id отбрасываются. Вызывающий может передать те же эффекты
       готовым списком (так делают клиент и дашборд: у них список приходит из
       derivePlayerEffects). Без этой защиты штраф применился бы ДВАЖДЫ, и
       заметить это было бы почти невозможно — бросок просто оказался бы
       ниже, чем показывает карточка. */
    var list = (ctx.attacker.effects || []).slice();
    var seen = {};
    list.forEach(function (e) { if (e && e.id) seen[e.id] = true; });
    deriveDrunkEffects(ctx.attacker, ctx.world).forEach(function (e) {
        if (!seen[e.id]) list.push(e);
    });
    list.forEach(function (e) {
        var m = e.modifiers || {};
        if (num(m.atk)) { acc.total += num(m.atk); part(acc, 'effect', e.tooltip || e.id, num(m.atk)); }
        if (num(m.dmg)) { acc.damageBonus += num(m.dmg); part(acc, 'effect', (e.tooltip || e.id) + ' (урон)', num(m.dmg)); }
        if (num(m.critChance)) { acc.critThreshold -= num(m.critChance); part(acc, 'effect', (e.tooltip || e.id) + ' (крит)', -num(m.critChance)); }
        if (num(m.critPower)) acc.critPower += num(m.critPower);
        (e.flags || []).forEach(function (f) { flag(acc, f); });
    });
    if (ctx.action === 'phys' && ctx.target && ctx.target.kind === 'enemy'
        && isBowArcher(ctx.attacker) && hunterMarkActive(ctx.attacker, ctx.world, ctx.target.id)) {
        acc.total += HUNTER_MARK_BONUS;
        part(acc, 'effect', 'Метка охотника', HUNTER_MARK_BONUS);
    }
    return acc;
}

var LAYERS = [layerBase, layerRole, layerClass, layerEffects];

/* --- Итог --------------------------------------------------------------- */
function finalize(acc) {
    var outcome, mult;
    /* Флаг `no_crit` ставит тот, кто по правилу крит запрещает — сейчас это
       бард на пустом Настроении. Проверяем ЗДЕСЬ, в одном месте, где исход
       и решается: иначе каждое такое правило лезло бы в пороги по-своему. */
    var критМожно = acc.flags.indexOf('no_crit') === -1;
    /* `no_attack` — бить нечем вовсе (бард без инструмента): удар не
       состоялся, что бы ни выпало. Промах, а не попадание на ноль — иначе
       «попал — не пустил» при разрыве боя сработало бы от пустых рук. */
    if (acc.flags.indexOf('no_attack') !== -1)                    { outcome = 'miss';  mult = MULT.miss; }
    else if (критМожно && acc.total >= acc.critThreshold) { outcome = 'crit';  mult = MULT.crit + acc.critPower; }
    else if (acc.total >= T.hit)        { outcome = 'hit';   mult = MULT.hit; }
    else if (acc.total >= T.graze)      { outcome = 'graze'; mult = MULT.graze; }
    else                                { outcome = 'miss';  mult = MULT.miss; }

    var exact=Math.max(0,(acc.baseDamage + acc.damageBonus) * mult), dmg=ceilGame(exact);
    return {
        raw: acc.raw,
        total: acc.total,
        critThreshold: acc.critThreshold,
        outcome: outcome,
        mult: mult,
        damage: Math.max(0, dmg), damageExact:exact,
        hit: outcome !== 'miss',
        flags: acc.flags,
        parts: acc.parts
    };
}

/* Единственная точка расчёта атаки. */
function exactDamage(result) { return num(result.damageExact == null ? result.damage : result.damageExact); }
function scaleDamage(result, mult) {
    result.damageExact=Math.max(0,exactDamage(result)*num(mult));
    result.damage=ceilGame(result.damageExact);
    return result;
}
function resourceCost(value) { return Math.max(0,ceilGame(value)); }
function resolveRoll(ctx) {
    var acc = newAcc(num(ctx.roll));
    for (var i = 0; i < LAYERS.length; i++) acc = LAYERS[i](acc, ctx);
    return finalize(acc);
}

/* ==========================================================================
   7. ЗАЩИТА  (раздел 3)
   ========================================================================== */

function resolveDefense(p) {
    var power = DEF_POWER[p.difficulty] || DEF_POWER.normal;
    var dmg = Math.max(0, exactDamage(p));
    if (p.canDefend === false) {
        return { outcome: 'none', label: 'Защита невозможна', reduced: 0, damageTaken: ceilGame(dmg) };
    }
    /* defMod — поправка от опьянения и Бадуна, считается defenseModifier(). */
    var roll = num(p.roll) + num(p.defMod), cut = 0, outcome = 'fail', label = 'Полный урон';
    if (roll >= DEF_THRESHOLD.parry) { cut = power.parry; outcome = 'parry'; label = 'Парирование'; }
    else if (roll >= DEF_THRESHOLD.block) { cut = power.block; outcome = 'block'; label = 'Блок'; }
    var taken = Math.max(0, ceilGame(dmg * (1 - cut)));
    return { outcome: outcome, label: label, cutPercent: Math.round(cut * 100), reduced: ceilGame(dmg) - taken, damageTaken: taken };
}

/* ==========================================================================
   8. ЭФФЕКТЫ — ВЫЧИСЛЯЮТСЯ, А НЕ ХРАНЯТСЯ  (разделы 6, 9; болячка №1)

   В базе лежат только ФАКТЫ:
       enemy.presence = { by, count, setRound }
       enemy.interceptAttemptedForTarget = <id цели, на которой была попытка>
   Активность считается сравнением с текущим раундом / текущим таргетом.
   Сменился раунд или цель — эффект перестал быть активным САМ.
   Снимать нечего, значит нечего и забыть снять.
   ========================================================================== */

var EFFECT_ICONS = {
    presence:  'assets/gear/spells/near.png',
    intercept: 'assets/gear/spells/already_catch.png',
    stealth:   'assets/gear/spells/shadowpng.png',
    frostbite: 'assets/gear/spells/icebolt.png',
    ready:     'assets/gear/spells/ready.png',
    hamstring: 'assets/gear/spells/immobilized.png',
    hunterMark: 'assets/gear/spells/target.png',
    burn:      'assets/gear/spells/burn.png',
    deep_wound: 'assets/gear/spells/deep_wound.png',
    infected_wound: 'assets/gear/spells/infected_wound.png',
    sickness: 'assets/gear/spells/sickness.png',
    hangover:  'assets/gear/spells/hangover .png',
    fury:      'assets/gear/spells/banditos_fury.png',
    howl:      'assets/gear/spells/wolf_howl.png',
    king:      'assets/icons/rat_king_icon.png',
    giant:     'assets/icons/bossbandit_icon.png',
    fear:      'assets/icons/alfawolf_icon.png',
    surrounded: 'assets/gear/spells/surrounded.png',
    shield:     'assets/gear/spells/total_defense.png',
    drunk:      'assets/interface/drunk.png',
    /* Молитвы жреца — картинки автора. */
    god_protection: 'assets/gear/spells/holly_deff.png',
